<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remove or replace</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="tpage">
<div class="tbar"><a href="T-Asset.dc.html">&lt; Asset</a><span>Defibrillator 01</span><span>Sample Technician</span></div>
<div class="tbody">
<div class="th" style="margin-bottom:4px">Mark Removed or Replaced</div>
<p class="sub" style="font-size:15px;margin-bottom:16px">The record stays in the history and stops appearing in due lists.</p>
<div class="tc" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div><label style="display:block;font-weight:600;margin-bottom:6px">What Happened</label><span class="seg"><button class="tbtn {{remCls}}" onClick="{{setRem}}">Removed</button><button class="tbtn {{repCls}}" onClick="{{setRep}}">Replaced</button></span></div>
<div><label for="d" style="display:block;font-weight:600;margin-bottom:6px">Date</label><input type="date" id="d" class="tin" value="2026-11-04"></div><div><label for="n" style="display:block;font-weight:600;margin-bottom:6px">New Serial Number (if replaced)</label><input id="n" class="tin" value="" placeholder="Scan or type"></div><div><label for="r" style="display:block;font-weight:600;margin-bottom:6px">Reason</label><input id="r" class="tin" value="" placeholder="e.g. Unit end of life"></div>
</div>
<div style="display:flex;justify-content:space-between;margin-top:14px"><a class="tbtn sec" href="T-Asset.dc.html">Cancel</a><a class="tbtn" href="T-Summary.dc.html">Save</a></div>
</div>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { m: 'rem' }; }
renderVals() {
return {
remCls: this.state.m === 'rem' ? '' : 'sec', repCls: this.state.m === 'rep' ? '' : 'sec', setRem: () => this.setState({ m: 'rem' }), setRep: () => this.setState({ m: 'rep' }),};
}
}
</script>
</body>
</html>
