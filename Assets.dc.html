<a class="nv on" href="Assets.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-9-10.5C2.600 7 5 4.500 8 4.500c1.800 0 3.200 1 4 2.500.8-1.500 2.200-2.500 4-2.500 3 0 5.400 2.500 5 6C20 16 12 21 12 21z"/></svg>Assets</a>

<a class="nv" href="Models.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Asset settings</a>

<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div><div class="crumb">Assets</div><div class="h1">Assets</div><div class="sub">6,575 assets: 6,567 defibrillators and 8 cabinets.</div></div>
<div class="acts"><button class="btn sec" onClick="{{o_export}}">Export CSV</button><a class="btn" href="Asset-New.dc.html">New asset</a></div></div>
<div class="tb"><label class="search"><input aria-label="Filter assets" placeholder="Filter by serial, model, site or asset number"></label></div>
<div class="tb"><template data-sc="for" list="{{chips}}" as="c" hint-placeholder-count="6"><button class="chip {{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></template></div>
<template data-sc="if" value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<div class="bulk" style="flex-wrap:wrap"><b>{{selCount}} selected</b><span style="flex:1"></span>
<button class="btn sec sm" onClick="{{o_transfer}}">Transfer</button><button class="btn sec sm" onClick="{{o_contract}}">Change contract</button><button class="btn sec sm" onClick="{{o_start}}">Change service start date</button><button class="btn sec sm" onClick="{{o_dates}}">Change service dates</button><button class="btn sec sm" onClick="{{o_addl}}">Add service levels</button><button class="btn sec sm" onClick="{{o_reml}}">Remove service levels</button><button class="btn sec sm" onClick="{{o_barcodes}}">Print barcodes</button><button class="btn sec sm" onClick="{{o_archive}}">Archive</button><button class="btnl" onClick="{{clearSel}}">Clear</button></div>
</template>
<div class="tw"><div style="overflow-x:auto"><div class="dt">
<div class="dr"><div class="dh" style="width:36px"><button class="opt2" onClick="{{toggleAll}}" aria-label="Select all"><span class="cbx {{allOn}}">✓</span></button></div><div class="dh">Asset ID</div><div class="dh">Type</div><div class="dh">AED model</div><div class="dh">Serial</div><div class="dh">Location on site</div><div class="dh">Site</div><div class="dh">Customer</div><div class="dh">Next due</div><div class="dh">Status</div></div>
<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="6"><div class="dr {{r.sel}}"><div class="dc"><button class="opt2" onClick="{{r.toggle}}" aria-label="Select row"><span class="cbx {{r.on}}">✓</span></button></div><div class="dc"><a class="cm" href="Asset.dc.html">{{r.id}}</a></div><div class="dc">{{r.type}}</div><div class="dc">{{r.model}}</div><div class="dc">{{r.serial}}</div><div class="dc">{{r.loc}}</div><div class="dc"><a href="Site.dc.html">{{r.site}}</a></div><div class="dc">{{r.cust}}</div><div class="dc">{{r.due}}</div><div class="dc"><span class="{{r.cls}}">{{r.status}}</span></div></div></template>
</div></div>
<div class="pager"><span>{{shown}} shown of 6,575</span><div><span class="n on">1</span><a href="Assets.dc.html">2</a><a href="Assets.dc.html">Next</a></div></div></div>
</main>
<template data-sc="if" value="{{d_transfer}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Transfer to another site<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="t1">New site</label><select id="t1" class="fi"><option>Sample Site 12 (Sample Client B)</option><option>Sample Site 15 (Sample Client A)</option></select></div><div class="f"><label for="t2">Effective date</label><input id="t2" class="fi" value="04/11/2026" placeholder=""></div><div class="f"><label for="t3">Reason</label><input id="t3" class="fi" value="" placeholder="Required"></div><p class="hint">Service levels and history move with the asset. The transfer is recorded in Transfer history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Transfer</button></div></div></div></template>
<template data-sc="if" value="{{d_contract}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Change contract<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="c1">Contract</label><select id="c1" class="fi"><option>Not selected</option><option>Service Contract</option><option>Monitoring & Programming</option></select></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Apply</button></div></div></div></template>
<template data-sc="if" value="{{d_start}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Change service start date<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="s1">New start date</label><input id="s1" class="fi" value="04/11/2026" placeholder=""></div><label class="chk" style="font-size:13px"><input type="checkbox" checked> Recalculate every service date from the new start date</label></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Apply</button></div></div></div></template>
<template data-sc="if" value="{{d_dates}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Change service dates<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="d1">Service level</label><select id="d1" class="fi"><option>Adult pad - 2 years</option><option>Adult pad - 5 years</option><option>Battery - 4 Years</option><option>Battery - 5 Years</option><option>Multi-function pad - 4.5 years</option><option>Paediatric - 2 years</option><option>Spare adult pad</option></select></div><div class="f"><label for="d2">New service date</label><input id="d2" class="fi" value="04/11/2028" placeholder=""></div><p class="hint">Only the chosen service level changes. The old date stays in history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Apply</button></div></div></div></template>
<template data-sc="if" value="{{d_addl}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Add service levels<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="fg c2"><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 4 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 5 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Multi-function pad - 4.5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Paediatric - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Spare adult pad</label></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Add</button></div></div></div></template>
<template data-sc="if" value="{{d_reml}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Remove service levels<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="fg c2"><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 4 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 5 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Multi-function pad - 4.5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Paediatric - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Spare adult pad</label></div><p class="hint">Removing a service level keeps its past dates in history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Remove</button></div></div></div></template>
<template data-sc="if" value="{{d_barcodes}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Print barcodes<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="b1">Label size</label><select id="b1" class="fi"><option>Avery L7651 (65 per sheet)</option><option>Avery L7160 (21 per sheet)</option></select></div><div class="f"><label for="b2">Barcode value</label><select id="b2" class="fi"><option>AEDS asset number</option><option>Asset ID</option><option>AED serial number</option></select></div><div class="f"><label for="b3">Start at label</label><input id="b3" class="fi" value="1" placeholder=""></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Create PDF</button></div></div></div></template>
<template data-sc="if" value="{{d_archive}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Archive assets<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="a1">Reason</label><select id="a1" class="fi"><option>Removed from site</option><option>Replaced</option><option>End of life</option><option>Duplicate record</option></select></div><p class="hint">Archived assets leave due lists and the portal. Their history stays.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Archive</button></div></div></div></template>
<template data-sc="if" value="{{d_export}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Export assets<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="radio" style="margin:0"><label class="chk" style="font-size:13px"><input type="radio" name="ex" checked> Selected assets</label><label class="chk" style="font-size:13px"><input type="radio" name="ex"> All matching (6,575)</label></div><p class="hint">CSV with customer, site, model, serial, service levels and status. Cabinet codes are never exported.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Download CSV</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":940}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { f: 'all', sel: {}, dlg: '', toast: '' }; }
renderVals() {
const st = this.state; const set = (o) => this.setState(o);
const D = [
{ id:'4904', type:'Defibrillator', model:'Mindray D1 Public', serial:'FQ63004564', loc:'Main foyer', site:'Sample Site 07', cust:'Sample Client A', due:'06/02/2021', status:'Past due, unverified', cls:'tag bd2', g:'past' },
{ id:'4905', type:'Cabinet', model:'100 Series', serial:'1234A567', loc:'Main foyer', site:'Sample Site 07', cust:'Sample Client A', due:'None', status:'OK', cls:'tag ok', g:'ok' },
{ id:'5120', type:'Defibrillator', model:'ZOLL AED Plus', serial:'X12K345678', loc:'Reception', site:'Sample Site 12', cust:'Sample Client B', due:'22/05/2021', status:'Past due, unverified', cls:'tag bd2', g:'past' },
{ id:'5388', type:'Defibrillator', model:'Philips HeartStart HS1', serial:'A21B-00321', loc:'Level 2 corridor', site:'Sample Site 15', cust:'Sample Client A', due:'28/11/2026', status:'Due in 24 days', cls:'tag wn', g:'soon' },
{ id:'5401', type:'Defibrillator', model:'Not set', serial:'None', loc:'Gym', site:'Sample Site 21', cust:'Sample Client A', due:'None', status:'Needs model', cls:'tag nt', g:'ok' },
{ id:'6012', type:'Defibrillator', model:'Mindray C2', serial:'FQ71009812', loc:'Canteen', site:'Sample Site 01', cust:'Sample Client A', due:'14/03/2028', status:'OK', cls:'tag ok', g:'ok' }
];
const chipDefs = [['all','All'],['Defibrillator','Defibrillator'],['Cabinet','Cabinet'],['past','Past due'],['soon','Due in 90 days'],['arch','Archived']];
const fil = D.filter((r) => st.f === 'all' || r.type === st.f || r.g === st.f);
const selIds = Object.keys(st.sel).filter((k) => st.sel[k]);
const toggle = (id) => { const n = Object.assign({}, st.sel); n[id] = !n[id]; set({ sel: n }); };
const msgs = { transfer:'Assets transferred', contract:'Contract changed', start:'Service start date changed', dates:'Service dates changed', addl:'Service levels added', reml:'Service levels removed', barcodes:'Barcode PDF created', archive:'Assets archived', export:'Export started' };
const out = {
chips: chipDefs.map((c) => ({ label: c[1], cls: st.f === c[0] ? 'on' : '', pick: () => set({ f: c[0] }) })),
rows: fil.map((r) => Object.assign({}, r, { on: st.sel[r.id] ? 'on' : '', sel: st.sel[r.id] ? 'sel' : '', toggle: () => toggle(r.id) })),
shown: fil.length,
allOn: fil.length && fil.every((r) => st.sel[r.id]) ? 'on' : '',
toggleAll: () => { const all = fil.every((r) => st.sel[r.id]); const n = {}; if (!all) fil.forEach((r) => { n[r.id] = true; }); set({ sel: n }); },
hasSel: selIds.length > 0, selCount: selIds.length || 'No', clearSel: () => set({ sel: {} }),
closeDlg: () => set({ dlg: '' }), okDlg: () => set({ dlg: '', toast: msgs[st.dlg] + (selIds.length ? ' (' + selIds.length + ')' : '') }),
hasToast: !!st.toast, toast: st.toast, hideToast: () => set({ toast: '' })
};
Object.keys(msgs).forEach((k) => { out['o_' + k] = () => set({ dlg: k }); out['d_' + k] = st.dlg === k; });
return out;
}
}
</script>
</body>
</html>
