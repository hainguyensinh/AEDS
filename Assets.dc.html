<div class="ph"><div><div class="crumb">Assets</div><div class="h1">Assets</div><div class="sub">6,575 assets: 6,567 defibrillators and 8 cabinets.</div></div>
<div class="acts"><button class="btn sec" onClick="{{o_export}}">Export CSV</button><a class="btn" href="Asset-New.dc.html">New Asset</a></div></div>

<div class="tb"><template data-sc="for" list="{{chips}}" as="c" hint-placeholder-count="6"><button class="chip {{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></template></div>
<template data-sc="if" value="{{hasSel}}" hint-placeholder-val="{{ false }}">

<template data-sc="if" value="{{d_transfer}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Transfer to Another Site<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="t1">New Site</label><select id="t1" class="fi"><option>Sample Site 12 (Sample Client B)</option><option>Sample Site 15 (Sample Client A)</option></select></div><div class="f"><label for="t2">Effective Date</label><input type="date" id="t2" class="fi" value="2026-11-04"></div><div class="f"><label for="t3">Reason</label><input id="t3" class="fi" value="" placeholder="Required"></div><p class="hint">Service levels and history move with the asset. The transfer is recorded in Transfer history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Transfer</button></div></div></div></template>
<template data-sc="if" value="{{d_start}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Change Service Start Date<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="s1">New Start Date</label><input type="date" id="s1" class="fi" value="2026-11-04"></div><label class="chk" style="font-size:13px"><input type="checkbox" checked> Recalculate every service date from the new start date</label></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Apply</button></div></div></div></template>
<template data-sc="if" value="{{d_dates}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Change Service Dates<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="d1">Service Level</label><select id="d1" class="fi"><option>Adult pad - 2 years</option><option>Adult pad - 5 years</option><option>Battery - 4 Years</option><option>Battery - 5 Years</option><option>Multi-function pad - 4.5 years</option><option>Paediatric - 2 years</option><option>Spare adult pad</option></select></div><div class="f"><label for="d2">New Service Date</label><input type="date" id="d2" class="fi" value="2028-11-04"></div><p class="hint">Only the chosen service level changes. The old date stays in history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Apply</button></div></div></div></template>
<template data-sc="if" value="{{d_addl}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Add Service Levels<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="fg c2"><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 4 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 5 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Multi-function pad - 4.5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Paediatric - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Spare adult pad</label></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Add</button></div></div></div></template>
<template data-sc="if" value="{{d_reml}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Remove Service Levels<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="fg c2"><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Adult pad - 5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 4 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Battery - 5 Years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Multi-function pad - 4.5 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Paediatric - 2 years</label><label class="chk" style="font-size:13px"><input type="checkbox"> Spare adult pad</label></div><p class="hint">Removing a service level keeps its past dates in history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Remove</button></div></div></div></template>
<template data-sc="if" value="{{d_barcodes}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Print Barcodes<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="b1">Label Size</label><select id="b1" class="fi"><option>Avery L7651 (65 per sheet)</option><option>Avery L7160 (21 per sheet)</option></select></div><div class="f"><label for="b2">Barcode Value</label><select id="b2" class="fi"><option>AEDS asset number</option><option>Asset ID</option><option>AED serial number</option></select></div><div class="f"><label for="b3">Start at Label</label><input id="b3" class="fi" value="1" placeholder=""></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Create PDF</button></div></div></div></template>
<template data-sc="if" value="{{d_archive}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Archive Assets<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="f"><label for="a1">Reason</label><select id="a1" class="fi"><option>Removed from site</option><option>Replaced</option><option>End of life</option><option>Duplicate record</option></select></div><p class="hint">Archived assets leave due lists and the portal. Their history stays.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Archive</button></div></div></div></template>
<template data-sc="if" value="{{d_export}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Export Assets<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub">{{selCount}} assets selected.</p><div class="radio" style="margin:0"><label class="chk" style="font-size:13px"><input type="radio" name="ex" checked> Selected assets</label><label class="chk" style="font-size:13px"><input type="radio" name="ex"> All matching (6,575)</label></div><p class="hint">CSV with customer, site, model, serial, service levels and status. Cabinet codes are never exported.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okDlg}}">Download CSV</button></div></div></div></template>
<template data-sc="if" value="{{d_merge1}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Merge Asset<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p class="sub" style="margin-top:0">Asset {{mid}} will be merged into the asset you choose. Its service levels, history and attachments move to that asset.</p><div class="f"><label for="mg1"><span class="req">*</span> Merge Into</label><select id="mg1" class="fi"><option>Asset 5120 · ZOLL AED Plus · X12K345678 · Sample Site 12</option><option>Asset 5388 · Philips HeartStart HS1 · A21B-00321 · Sample Site 15</option><option>Asset 6012 · Mindray C2 · FQ71009812 · Sample Site 01</option></select></div><p class="hint">Use this for duplicate records, for example the same serial number entered twice.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okMerge1}}">Merge</button></div></div></div></template>
<template data-sc="if" value="{{d_delete1}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Delete Asset<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p style="margin-top:0">Delete asset {{mid}}? This cannot be undone. Use Archive instead if the asset has service history.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" style="background:#b42318;border-color:#b42318" onClick="{{okDel1}}">Delete</button></div></div></div></template>
<template data-sc="if" value="{{d_delete}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Delete Assets<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p style="margin-top:0">Delete {{selCount}} selected assets? This cannot be undone. Assets with service history should be archived instead.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" style="background:#b42318;border-color:#b42318" onClick="{{okDlg}}">Delete</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
