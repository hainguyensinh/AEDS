<div class="ph"><div class="phl"><a class="back" href="Sites.dc.html" aria-label="Back" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="crumb"><a href="Sites.dc.html">Sites</a> / Sample Site 07</div><div class="h1">Sample Site 07</div><div class="sub">Customer: <a href="Customer.dc.html">Sample Client A</a> · Parramatta NSW · <span class="tag bd2">2 past due</span></div></div></div>

</div>
<template data-sc="if" value="{{isTopProfile}}" hint-placeholder-val="{{ true }}"><div class="stabs"><template data-sc="for" list="{{subs}}" as="t" hint-placeholder-count="4"><button class="stab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template></div></template>

<template data-sc="if" value="{{isProfile}}" hint-placeholder-val="{{ true }}">

t"><span class="b" tabindex="0">Options</span><span class="mn"><a href="Customer.dc.html">View customer</a><button onClick="{{o_transfer}}">Transfer to another customer</button></span></span></td></tr></tbody></table></div><p class="hint" style="margin-top:10px">Ownership changes are listed in the History tab. Whether a site can have more than one customer is open (decision D9).</p></div>

</main>
