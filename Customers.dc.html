<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Customers</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="app">
<nav class="side">
<div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#d8352a" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3.2 1.8-2.1 3.5-3.2 5.5-3.2 3.7 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg></span>AEDS</div>
<a class="nv" href="Main.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
<a class="nv on" href="Customers.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>Customers</a>
<a class="nv" href="Sites.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sites</a>
<a class="nv" href="Contacts.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Contacts</a>
<a class="nv" href="Assets.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-9-10.5C2.600 7 5 4.500 8 4.500c1.800 0 3.200 1 4 2.500.8-1.500 2.200-2.500 4-2.500 3 0 5.400 2.500 5 6C20 16 12 21 12 21z"/></svg>Assets</a>
<a class="nv" href="Compliance.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Compliance<span class="bd">12,908</span></a>
<a class="nv" href="Reports.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
<div class="gl">Admin</div>
<a class="nv" href="Audit.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Audit Log</a>
<a class="nv" href="People.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.3 5.5 2.2 5.5 5.8"/></svg>People</a>
<a class="nv" href="Models.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Asset Settings</a>
<div class="who"><span class="av">AD</span><div>Sample Admin<small>Administrator</small></div></div>
</nav>
<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph" style="margin-bottom:10px"><div><div class="h1">Customers <span style="color:var(--t3);font-weight:500">(3,732)</span></div></div>
<div class="acts"><a class="btn" href="Customer-New.dc.html">+ Create Customer</a><button class="ibtn" onClick="{{openExport}}" aria-label="Export CSV" title="Export CSV"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button></div></div>
<div class="azl"><template data-sc="for" list="{{letters}}" as="l" hint-placeholder-count="28"><button class="{{l.cls}}" onClick="{{l.pick}}">{{l.label}}</button></template></div>
<div class="sbx"><div class="grpin"><input aria-label="Search customers" placeholder="Search by name, email, phone or ID"><button>Search</button></div>
<button class="btnl" onClick="{{toggleAdv}}">{{advLabel}}</button><button class="btnl" onClick="{{openSave}}">Save Search</button><button class="btnl" onClick="{{openCols}}">Modify Table View</button></div>

<template data-sc="if" value="{{adv}}" hint-placeholder-val="{{ false }}">
<div class="panel"><div class="fg c4">
<div class="f"><label for="a2">Company or Individual</label><select id="a2" class="fi"><option>Not Selected</option><option>Company</option><option>Individual</option></select></div>
<div class="f"><label for="a3">State</label><select id="a3" class="fi"><option>Not Selected</option><option>NSW</option><option>VIC</option><option>QLD</option><option>WA</option></select></div>
<div class="f"><label for="a5">Compliance</label><select id="a5" class="fi"><option>Not Selected</option><option>Past due</option><option>Due in 90 days</option><option>Up to date</option></select></div>
<div class="f"><label for="a6">Portal Access</label><select id="a6" class="fi"><option>Not Selected</option><option>Active</option><option>Invited</option><option>Not invited</option></select></div>
<div class="f"><label for="a7">Created From</label><input type="date" id="a7" class="fi"></div>
<div class="f"><label for="a8">Created To</label><input type="date" id="a8" class="fi"></div>
<div class="f" style="grid-column:1/-1"><label class="chk" style="font-size:13px"><input type="checkbox"> Include archived customers</label></div>
</div>
<div class="bar"><button class="btn sec" onClick="{{toggleAdv}}">Clear</button><button class="btn" onClick="{{toggleAdv}}">Apply Filters</button></div></div>
</template>




<template data-sc="if" value="{{hasSel}}" hint-placeholder-val="{{ false }}">
<div class="bulk"><b>{{selCount}} selected</b><span style="flex:1"></span><button class="btn sec sm" onClick="{{openExport}}">Export Selected</button><button class="btn sec sm" onClick="{{o_bmap}}">Map Customers</button><button class="btn sec sm" onClick="{{o_bmerge}}">Merge</button><button class="btn sec sm" onClick="{{openArchive}}">Archive</button><button class="btn sec sm" onClick="{{o_bdel}}">Delete</button><button class="btnl" onClick="{{clearSel}}">Clear</button></div>
</template>

<div class="tw"><div style="overflow-x:auto"><div class="dt">
<div class="dr"><div class="dh" style="width:36px"><button class="opt2" onClick="{{toggleAll}}" aria-label="Select all"><span class="cbx {{allOn}}">✓</span></button></div><div class="dh">Customer<span class="so">▼</span></div><template data-sc="for" list="{{cols}}" as="c" hint-placeholder-count="8"><div class="dh {{c.al}}">{{c.label}}<span class="so">▼</span></div></template><div class="dh"></div></div>
<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="6"><div class="dr {{r.sel}}"><div class="dc"><button class="opt2" onClick="{{r.toggle}}" aria-label="Select row"><span class="cbx {{r.on}}">✓</span></button></div><div class="dc"><a class="cm" href="Customer.dc.html">{{r.name}}</a><div class="cs">{{r.kind}}</div></div><template data-sc="for" list="{{r.cells}}" as="c" hint-placeholder-count="8"><div class="dc {{c.al}}"><span class="{{c.cls}}">{{c.v}}</span></div></template><div class="dc r"><span class="opt"><span class="b" tabindex="0">Options</span><span class="mn"><a href="Customer.dc.html">Edit Customer Details</a>
<div class="sub2"><span>View</span><div class="mn2"><a href="Customer.dc.html">Notes</a><a href="Customer.dc.html">Service History</a><a href="P-Assets.dc.html">Customer Portal (as customer)</a></div></div>
<button onClick="{{r.map}}">Map Customer</button>
<button onClick="{{r.merge}}">Merge Customer</button>
<div class="sep"></div>
<button onClick="{{r.archive}}">Archive Customer</button>
<button class="dng" onClick="{{r.del}}">Delete Customer</button></span></span></div></div></template>
</div></div>
<div class="pager"><div style="align-items:center;gap:8px"><span>Rows per page</span><select class="fi" aria-label="Rows per page" onChange="{{setPs}}"><template data-sc="for" list="{{psOpts}}" as="o" hint-placeholder-count="4"><option value="{{o.v}}">{{o.v}}</option></template></select><span>{{pgFrom}}–{{pgTo}} of {{pgTotal}}</span></div><div><button class="pgb {{pgPrevCls}}" onClick="{{pgPrev}}">Prev</button><template data-sc="for" list="{{pgList}}" as="g" hint-placeholder-count="5"><button class="pgb {{g.cls}}" onClick="{{g.go}}">{{g.n}}</button></template><button class="pgb {{pgNextCls}}" onClick="{{pgNext}}">Next</button></div></div></div>
</main>

<template data-sc="if" value="{{dlgCols}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">Modify Table View<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb"><p class="sub">Choose the columns to show. Customer name is always shown. Your choice is saved for you only.</p>
<div class="fg c2"><template data-sc="for" list="{{allCols}}" as="c" hint-placeholder-count="14"><button class="opt2" onClick="{{c.toggle}}"><span class="cbx {{c.on}}">✓</span>{{c.label}}</button></template></div></div>
<div class="mf"><button class="btn gh" onClick="{{resetCols}}">Reset to Default</button><button class="btn" onClick="{{closeDlg}}">Done</button></div></div></div>
</template>

<template data-sc="if" value="{{dlgSave}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">Save Search<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb"><div class="f"><label for="sv1">Name</label><input id="sv1" class="fi" value="NSW customers past due"></div>
<p class="sub">Saves the current filters, letter and columns: {{filterSummary}}.</p>
<button class="opt2" onClick="{{toggleShare}}"><span class="cbx {{shareOn}}">✓</span>Share with all staff</button></div>
<div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{doSave}}">Save Search</button></div></div></div>
</template>

<template data-sc="if" value="{{dlgExport}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">Export Customers<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb">
<div><div class="f"><label>Rows</label></div><div class="radio" style="margin:0"><button class="opt2" onClick="{{rowsSel}}"><span class="rd {{rowsSelOn}}"></span>Selected ({{selCount}})</button><button class="opt2" onClick="{{rowsAll}}"><span class="rd {{rowsAllOn}}"></span>All matching (3,732)</button></div></div>
<div><div class="f"><label>Columns</label></div><div class="radio" style="margin:0"><button class="opt2" onClick="{{colsVis}}"><span class="rd {{colsVisOn}}"></span>Columns shown ({{colCount}})</button><button class="opt2" onClick="{{colsAllX}}"><span class="rd {{colsAllOn}}"></span>All columns (18)</button></div></div>
<p class="hint">CSV, UTF-8. Cabinet codes and internal notes are never exported.</p></div>
<div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{doExport}}">Download CSV</button></div></div></div>
</template>

<template data-sc="if" value="{{dlgArchive}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">Archive Customer<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb"><p>Customers with history cannot be deleted. Archiving hides them from lists and ends their portal access. Sites and assets stay linked.</p>
<div class="f"><label for="ar1">Reason</label><select id="ar1" class="fi"><option>No longer a customer</option><option>Duplicate record</option><option>Business closed</option><option>Other</option></select></div></div>
<div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{doArchive}}">Archive</button></div></div></div>
</template>

<template data-sc="if" value="{{dlgDel}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Delete Customer<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p>Sample Client A has sites, assets and service history, so it cannot be deleted.</p><p class="sub">Archive it instead to hide it from lists and end portal access. Only customers with no history can be deleted.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{openArchive}}">Archive Instead</button></div></div></div></template>
<template data-sc="if" value="{{dlgMap}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl mapd"><div class="mh"><span>Map: {{omName}}</span><button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="mapg2"><div class="mapl2"><div class="maph">Customer</div><template data-sc="for" list="{{omList}}" as="p" hint-placeholder-count="3"><div class="mapli2"><span>{{p.n}}<span class="cs" style="display:block;font-size:11px">{{p.a}}</span></span><span class="mapb">{{p.i}}</span></div></template><template data-sc="for" list="{{omMiss}}" as="p" hint-placeholder-count="0"><div class="mapli2"><span>{{p.n}}<span class="cs" style="display:block;font-size:11px">No address, not on the map</span></span><span class="mapb off">–</span></div></template></div><div class="mapw"><svg viewBox="0 0 430 360" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%"><path d="M15.0 130.0 L20.0 170.0 L30.0 225.0 L38.0 253.0 L60.0 260.0 L110.0 248.0 L140.0 233.0 L190.0 225.0 L220.0 235.0 L236.0 258.0 L258.0 240.0 L260.0 266.0 L280.0 290.0 L315.0 298.0 L343.0 301.0 L360.0 288.0 L380.0 284.0 L393.0 248.0 L416.0 192.0 L410.0 160.0 L388.0 135.0 L370.0 115.0 L340.0 95.0 L334.0 60.0 L315.0 50.0 L305.0 17.0 L296.0 40.0 L295.0 80.0 L280.0 86.0 L255.0 70.0 L240.0 60.0 L248.0 32.0 L205.0 25.0 L183.0 35.0 L175.0 60.0 L150.0 50.0 L130.0 60.0 L110.0 80.0 L100.0 92.0 L70.0 110.0 L40.0 117.0 Z M326.0 317.0 L363.0 319.0 L360.0 342.0 L345.0 346.0 L332.0 332.0 Z" fill="#dfe8f2" stroke="#9fb3cb" stroke-width="1.2" stroke-linejoin="round"/></svg><template data-sc="for" list="{{omPins}}" as="p" hint-placeholder-count="3"><span class="pin2" style="left:{{p.x}}%;top:{{p.y}}%" title="{{p.n}}"><b>{{p.i}}</b></span></template><label class="maps"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input placeholder="Enter address" aria-label="Enter address"></label><button class="mapy" aria-label="Map layers" title="Map layers"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button><div class="mapz"><button aria-label="Zoom in">+</button><button aria-label="Zoom out">−</button></div><div class="mapsc"><span>300 km</span><span>200 mi</span></div><div class="mapa">Leaflet | © LocationIQ Maps, OpenStreetMap contributors (mockup)</div></div></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Close</button></div></div></div></template>
<template data-sc="if" value="{{dlgAddsite}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Add Site to Sample Client A<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="f"><label for="as1">Site</label><input id="as1" class="fi" placeholder="Search existing sites by name or address"></div><p class="hint">Or create a new site with its own address.</p><a class="btn sec" href="Site-New.dc.html" style="align-self:flex-start">Create New Site</a></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okToast}}">Add</button></div></div></div></template>
<template data-sc="if" value="{{dlgInvite}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Invite Portal User<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="f"><label for="iv1">Contact</label><select id="iv1" class="fi"><option>Sample Contact 01 (c01@sample-a.example)</option><option>New person</option></select></div><p class="hint">Sees only this customer. The invite link expires in 7 days.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{okToast}}">Send Invite</button></div></div></div></template>
<template data-sc="if" value="{{d_merge}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Merge Customers<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="f"><label for="mg1">Merge into *</label><input id="mg1" class="fi" placeholder="Search customers"><span class="hint">Wildcard search is %</span></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_merge}}">Merge</button></div></div></div></template>
<template data-sc="if" value="{{d_bmap}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl mapd"><div class="mh"><span>Map Customers</span><button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="mapg2"><div class="mapl2"><div class="maph">Customer(s)</div><template data-sc="for" list="{{bmList}}" as="p" hint-placeholder-count="3"><div class="mapli2"><span>{{p.n}}<span class="cs" style="display:block;font-size:11px">{{p.a}}</span></span><span class="mapb">{{p.i}}</span></div></template><template data-sc="for" list="{{bmMiss}}" as="p" hint-placeholder-count="0"><div class="mapli2"><span>{{p.n}}<span class="cs" style="display:block;font-size:11px">No address, not on the map</span></span><span class="mapb off">–</span></div></template></div><div class="mapw"><svg viewBox="0 0 430 360" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%"><path d="M15.0 130.0 L20.0 170.0 L30.0 225.0 L38.0 253.0 L60.0 260.0 L110.0 248.0 L140.0 233.0 L190.0 225.0 L220.0 235.0 L236.0 258.0 L258.0 240.0 L260.0 266.0 L280.0 290.0 L315.0 298.0 L343.0 301.0 L360.0 288.0 L380.0 284.0 L393.0 248.0 L416.0 192.0 L410.0 160.0 L388.0 135.0 L370.0 115.0 L340.0 95.0 L334.0 60.0 L315.0 50.0 L305.0 17.0 L296.0 40.0 L295.0 80.0 L280.0 86.0 L255.0 70.0 L240.0 60.0 L248.0 32.0 L205.0 25.0 L183.0 35.0 L175.0 60.0 L150.0 50.0 L130.0 60.0 L110.0 80.0 L100.0 92.0 L70.0 110.0 L40.0 117.0 Z M326.0 317.0 L363.0 319.0 L360.0 342.0 L345.0 346.0 L332.0 332.0 Z" fill="#dfe8f2" stroke="#9fb3cb" stroke-width="1.2" stroke-linejoin="round"/></svg><template data-sc="for" list="{{bmPins}}" as="p" hint-placeholder-count="3"><span class="pin2" style="left:{{p.x}}%;top:{{p.y}}%" title="{{p.n}}"><b>{{p.i}}</b></span></template><label class="maps"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11
