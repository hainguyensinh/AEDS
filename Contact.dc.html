</template>
<template data-sc="if" value="{{is_cust}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Customers</div><div class="sbx" style="margin-bottom:12px"><div class="grpin"><input aria-label="Add from existing customers" placeholder="Add from existing customers"><button onClick="{{add_cust}}">Add</button></div></div><div class="tw"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th style="width:36px"><input type="checkbox" aria-label="Select all"></th><th>Customer<span class="so">▼</span></th><th>Customer ID<span class="so">▼</span></th><th>Phone<span class="so">▼</span></th><th>Email<span class="so">▼</span></th><th>Address<span class="so">▼</span></th><th>Suburb<span class="so">▼</span></th><th>State<span class="so">▼</span></th><th>Postcode<span class="so">▼</span></th><th>Country<span class="so">▼</span></th><th>Role</th><th>Primary</th><th>Receives invoices</th><th>Receives statements</th></tr></thead><tbody><tr><td><input type="checkbox" aria-label="Select row"></td><td><a class="cm" href="Customer.dc.html">Sample Client A</a></td><td>0001</td><td>00 0000 0001</td><td>c01@sample.example</td><td>1 Sample St</td><td>Sydney</td><td>NSW</td><td>2000</td><td>Australia</td><td><select class="fi" style="min-width:110px" aria-label="Role"><option>Primary</option><option>Accounts</option><option>Other</option></select></td><td><input type="checkbox" checked aria-label="Primary"></td><td><input type="checkbox" checked aria-label="Receives invoices"></td><td><input type="checkbox" checked aria-label="Receives statements"></td></tr></tbody></table></div></div><div class="bar" style="justify-content:flex-start"><button class="btnl" onClick="{{map_cust}}">Map customers</button><button class="btnl" onClick="{{rm_cust}}">Remove from contact</button></div></div></template>

<template data-sc="if" value="{{is_logs}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Logs</div><div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>User</th><th>Change</th></tr></thead><tbody><tr><td>04/11/2026 09:12</td><td>Sample Office</td><td>Mobile phone changed</td></tr><tr><td>02/11/2026 15:40</td><td>Sample Admin</td><td>Linked to Sample Site 07</td></tr><tr><td>07/07/2021 10:02</td><td>Sample Admin</td><td>Contact created</td></tr></tbody></table></div></div></template>
</main>

<template data-sc="if" value="{{d_save}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Save<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_save}}">Save</button></div></div></div></template>
<template data-sc="if" value="{{d_cmerge}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Merge contacts<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="f"><label for="mg1">Merge into *</label><input id="mg1" class="fi" placeholder="Search contacts"><span class="hint">Wildcard search is %</span></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_cmerge}}">Merge</button></div></div></div></template>
<template data-sc="if" value="{{d_cdel}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Delete contact<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p>Delete Sample Contact 01?</p><p class="sub">It is removed from every customer and site it is linked to. Portal access ends.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_cdel}}">Delete</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
