<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div class="phl"><a class="back" href="Contacts.dc.html" aria-label="Back" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="crumb"><a href="Contacts.dc.html">Contacts</a> / Sample Contact 01</div><div class="h1">Sample Contact 01</div></div></div><div class="acts"><span class="opt"><span class="b" tabindex="0" style="height:38px">Options</span><span class="mn"><button onClick="{{o_cmerge}}">Merge Contact</button><button class="dng" onClick="{{o_cdel}}">Delete Contact</button></span></span></div></div>

</template>
<template data-sc="if" value="{{is_cust}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Customers</div><div class="sbx" style="margin-bottom:12px"><div class="grpin"><input aria-label="Add from existing customers" placeholder="Add from existing customers"><button onClick="{{add_cust}}">Add</button></div></div><div class="tw"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th style="width:36px"><input type="checkbox" aria-label="Select all"></th><th>Customer<span class="so">▼</span></th><th>Customer ID<span class="so">▼</span></th><th>Phone<span class="so">▼</span></th><th>Email<span class="so">▼</span></th><th>Address<span class="so">▼</span></th><th>Suburb<span class="so">▼</span></th><th>State<span class="so">▼</span></th><th>Postcode<span class="so">▼</span></th><th>Country<span class="so">▼</span></th></tr></thead><tbody><tr><td><input type="checkbox" aria-label="Select row"></td><td><a class="cm" href="Customer.dc.html">Sample Client A</a></td><td>0001</td><td>00 0000 0001</td><td>c01@sample.example</td><td>1 Sample St</td><td>Sydney</td><td>NSW</td><td>2000</td><td>Australia</td></tr></tbody></table></div></div><div class="bar" style="justify-content:flex-start"><button class="btnl" onClick="{{map_cust}}">Map Customers</button><button class="btnl" onClick="{{rm_cust}}">Remove from Contact</button></div></div></template>
<template data-sc="if" value="{{is_sites}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Sites</div><div class="sbx" style="margin-bottom:12px"><div class="grpin"><input aria-label="Add from existing sites" placeholder="Add from existing sites"><button onClick="{{add_sites}}">Add</button></div></div><div class="tw"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th style="width:36px"><input type="checkbox" aria-label="Select all"></th><th>Site<span class="so">▼</span></th><th>Site ID<span class="so">▼</span></th><th>Site Address<span class="so">▼</span></th><th>Site Suburb<span class="so">▼</span></th><th>Site State<span class="so">▼</span></th><th>Site Postcode<span class="so">▼</span></th><th>Customer<span class="so">▼</span></th></tr></thead><tbody><tr><td><input type="checkbox" aria-label="Select row"></td><td><a class="cm" href="Site.dc.html">Sample Site 01</a></td><td>2219</td><td>1 Sample Road</td><td>Broadmeadow</td><td>NSW</td><td>2292</td><td>Sample Client A</td></tr><tr><td><input type="checkbox" aria-label="Select row"></td><td><a class="cm" href="Site.dc.html">Sample Site 07</a></td><td>0014</td><td>2 Sample Rd</td><td>Parramatta</td><td>NSW</td><td>2022</td><td>Sample Client A</td></tr></tbody></table></div></div><div class="bar" style="justify-content:flex-start"><button class="btnl" onClick="{{map_sites}}">Map Sites</button><button class="btnl" onClick="{{rm_sites}}">Remove from Contact</button></div></div></template>
<template data-sc="if" value="{{is_logs}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Logs <span class="cs">{{lgCount}}</span></div><div class="lgf"><div class="f"><label for="lq">Search</label><input id="lq" class="fi" placeholder="Search field, value or note" value="{{lq}}" onChange="{{setLq}}"></div><div class="f"><label for="lev">Event</label><select id="lev" class="fi" onChange="{{setLev}}"><template data-sc="for" list="{{lgEvents}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.v}}</option></template></select></div><div class="f"><label for="lus">User</label><select id="lus" class="fi" onChange="{{setLus}}"><template data-sc="for" list="{{lgUsers}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.v}}</option></template></select></div><div class="f" style="position:relative"><label for="lrd">Log Date</label><button id="lrd" class="fi lrb" onClick="{{lrToggle}}" aria-label="Choose log date range"><span class="{{lrPh}}">{{lrLabel}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><template data-sc="if" value="{{lrOpen}}" hint-placeholder-val="{{ false }}"><div class="lrp"><div class="lrh"><button onClick="{{lrPrev}}" aria-label="Previous month">‹</button><span>{{lrMonth}}</span><button onClick="{{lrNext}}" aria-label="Next month">›</button></div><div class="lrg"><span class="lrw">Mo</span><span class="lrw">Tu</span><span class="lrw">We</span><span class="lrw">Th</span><span class="lrw">Fr</span><span class="lrw">Sa</span><span class="lrw">Su</span><template data-sc="for" list="{{lrDays}}" as="d" hint-placeholder-count="35"><button class="lrd {{d.cls}}" onClick="{{d.pick}}">{{d.n}}</button></template></div><div class="lrq"><button onClick="{{lrToday}}">Today</button><button onClick="{{lr7}}">Last 7 Days</button><button onClick="{{lr30}}">Last 30 Days</button><button onClick="{{lrMon}}">This Month</button></div><div class="lrf"><span>{{lrHint}}</span><span><button class="btnl" onClick="{{lrClear}}">Clear</button> <button class="btn sm" onClick="{{lrDone}}">Done</button></span></div></div></template></div><button class="btnl" style="height:38px" onClick="{{lgClear}}">Clear Filters</button></div><div class="tw"><table class="tbl"><thead><tr><th style="width:70px">Time</th><th style="width:120px">Event</th><th style="width:170px">Field</th><th>Change</th><th style="width:150px">By</th></tr></thead><tbody><template data-sc="for" list="{{lgRows}}" as="r" hint-placeholder-count="6"><template data-sc="if" value="{{r.isDay}}" hint-placeholder-val="{{ false }}"><tr class="lgg"><td colspan="5">{{r.day}}</td></tr></template><template data-sc="if" value="{{r.isRow}}" hint-placeholder-val="{{ true }}"><tr><td>{{r.time}}</td><td><span class="tag {{r.cls}}">{{r.ev}}</span></td><td class="cm">{{r.field}}</td><td style="white-space:normal"><template data-sc="if" value="{{r.hasOld}}" hint-placeholder-val="{{ false }}"><span class="lgo">{{r.old}}</span><span class="lga">→</span></template>{{r.nv}}<template data-sc="if" value="{{r.hasNote}}" hint-placeholder-val="{{ false }}"><div class="cs" style="font-size:12px">{{r.note}}</div></template></td><td>{{r.by}}</td></tr></template></template><template data-sc="if" value="{{lgNone}}" hint-placeholder-val="{{ false }}"><tr><td colspan="5" class="cs">No log entries match these filters.</td></tr></template></tbody></table></div></div></template>
