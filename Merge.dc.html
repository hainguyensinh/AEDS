<a class="nv" href="Models.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Asset settings</a>
<a class="nv on" href="Merge.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v6a4 4 0 004 4h8M18 14l-3-3M18 14l-3 3M6 20V14"/></svg>Site transfers</a>
<div class="who"><span class="av">AD</span><div>Sample Admin<small>Administrator</small></div></div>
</nav>
<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div class="phl"><a class="back" href="Sites.dc.html" aria-label="Back" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="crumb">Admin</div><div class="h1">Site transfers</div><div class="sub">Move a site, with its AEDs and files, to another customer. The old owner loses portal access at once.</div></div></div></div>

<div class="tabs">
<template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="2"><button class="tab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template>
</div>

<template data-sc="if" value="{{isMove}}" hint-placeholder-val="{{ true }}">
<div class="gm">
<div class="card"><div class="ch">Sites waiting for an owner <span>279 under the Unassigned customer</span></div>
<div class="tb"><label class="search"><input aria-label="Filter sites" placeholder="Filter sites"></label></div>
<div class="tw"><table class="tbl"><thead><tr><th></th><th>Site</th><th>Suburb</th><th class="r">AEDs</th><th>Suggested customer</th></tr></thead><tbody>
<tr><td><input type="radio" name="s" checked aria-label="Select site"></td><td class="cm">Sample Site 30</td><td>Brisbane</td><td class="r">2</td><td>Sample Client A <span class="tag in">Name match</span></td></tr>
<tr><td><input type="radio" name="s" aria-label="Select site"></td><td class="cm">Sample Site 31</td><td>Brisbane</td><td class="r">1</td><td>Sample Client A <span class="tag in">Name match</span></td></tr>
<tr><td><input type="radio" name="s" aria-label="Select site"></td><td class="cm">Sample Site 32</td><td>Cairns</td><td class="r">3</td><td>Sample Client B <span class="tag in">Email match</span></td></tr>
<tr><td><input type="radio" name="s" aria-label="Select site"></td><td class="cm">Sample Site 33</td><td>Perth</td><td class="r">1</td><td class="cs">No suggestion</td></tr>
</tbody></table></div></div>
<div class="card"><div class="ch">Transfer Sample Site 30</div>
<div class="f" style="margin-bottom:14px"><label for="cu">New customer</label><select id="cu" class="fi"><option>Sample Client A</option><option>Sample Client B</option></select></div>
<div class="f" style="margin-bottom:14px"><label for="dt">Effective date</label><input id="dt" class="fi" value="04/11/2026"></div>
<div class="f" style="margin-bottom:14px"><label for="rs">Reason (required)</label><textarea id="rs" class="fi" rows="3">Customer confirmed ownership by email</textarea></div>
<div class="banner">2 AEDs and 3 files move with the site. Ownership history records from, to, date, reason and who.</div>
<div class="bar"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_tr}}">Transfer site</button></div></div>
</div>
</template>

<template data-sc="if" value="{{isHistory}}" hint-placeholder-val="{{ false }}">
<div class="tw"><table class="tbl"><thead><tr><th>Site</th><th>From</th><th>To</th><th>Date</th><th>Reason</th><th>By</th></tr></thead><tbody>
<tr><td class="cm"><a href="Site.dc.html">Sample Site 07</a></td><td>Unassigned</td><td>Sample Client A</td><td>02/11/2026</td><td>Matched during clean-up</td><td>Sample Admin</td></tr>
<tr><td class="cm"><a href="Site.dc.html">Sample Site 12</a></td><td>Sample Client B</td><td>Sample Client E</td><td>28/10/2026</td><td>Business sold</td><td>Sample Office</td></tr>
<tr><td class="cm"><a href="Site.dc.html">Sample Site 21</a></td><td>None</td><td>Unassigned</td><td>31/10/2026</td><td>Imported from Simpro</td><td>System</td></tr>
</tbody></table></div>
</template>
</main>
<template data-sc="if" value="{{d_tr}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh"><button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_tr}}">x</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":940}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { dlg: '', toast: '',  tab: 'move' }; }
renderVals() {
const defs = [['move','Transfer a site'],['history','Ownership history']];
const cur = this.state.tab;
return {
closeDlg: () => this.setState({ dlg: '' }), hasToast: !!this.state.toast, toast: this.state.toast, hideToast: () => this.setState({ toast: '' }),
o_tr: () => this.setState({ dlg: 'tr' }), d_tr: this.state.dlg === 'tr', ok_tr: () => this.setState({ dlg: '', toast: 'Site transferred. Ownership history updated.' }),

tabs: defs.map((d) => ({ label: d[1], cls: d[0] === cur ? 'on' : '', pick: () => this.setState({ tab: d[0] }) })),
isMove: cur === 'move', isHistory: cur === 'history'
};
}
}
</script>
</body>
</html>
