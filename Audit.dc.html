<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":940}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { dlg: '', toast: '' }; }
renderVals() {
return {
...(() => { const T = 60; const ps = this.state.ps || 10; const pages = Math.max(1, Math.ceil(T / ps)); const pg = Math.min(this.state.pg || 1, pages); const go = (n) => () => this.setState({ pg: n }); const nums = pages <= 7 ? Array.from({ length: pages }, (_, i) => i + 1) : (pg <= 4 ? [1, 2, 3, 4, 5, 0, pages] : pg >= pages - 3 ? [1, 0, pages - 4, pages - 3, pages - 2, pages - 1, pages] : [1, 0, pg - 1, pg, pg + 1, 0, pages]); const f = (n) => n.toLocaleString('en-AU'); return { psOpts: [10, 25, 50, 100].map((v) => ({ v })), setPs: (e) => this.setState({ ps: +e.target.value, pg: 1 }), pgFrom: f((pg - 1) * ps + 1), pgTo: f(Math.min(pg * ps, T)), pgTotal: f(T), pgList: nums.map((n) => n ? { n: f(n), cls: n === pg ? 'on' : '', go: go(n) } : { n: '…', cls: 'gap', go: () => {} }), pgPrev: go(Math.max(1, pg - 1)), pgNext: go(Math.min(pages, pg + 1)), pgPrevCls: pg === 1 ? 'dis' : '', pgNextCls: pg === pages ? 'dis' : '' }; })(),

closeDlg: () => this.setState({ dlg: '' }), hasToast: !!this.state.toast, toast: this.state.toast, hideToast: () => this.setState({ toast: '' }),
o_csv: () => this.setState({ dlg: 'csv' }), d_csv: this.state.dlg === 'csv', ok_csv: () => this.setState({ dlg: '', toast: 'Export started' }),
};
}
}
</script>
