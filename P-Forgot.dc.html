<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="auth">
<div class="l"><div class="box">
<div class="pb" style="margin-bottom:32px"><span class="mark" style="background:var(--p0)"><svg width="18" height="18" viewBox="0 0 24 24" fill="#d8352a" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.700 1.100 5.500 3.200 1.800-2.100 3.500-3.200 5.500-3.200 3.700 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg></span><span style="color:var(--p7)">AEDS Customer Portal</span></div>
<h1 class="h1" style="margin-bottom:6px">Reset your password</h1>
<p class="sub" style="margin-bottom:24px">Enter your email and we will send a reset link if an account exists.</p>
<div class="f" style="margin-bottom:20px"><label for="e">Email</label><input id="e" class="fi" value="pa@sample-a.example"></div>
<button class="btn" style="width:100%;height:44px" onClick="{{send}}">Send reset link</button><template data-sc="if" value="{{sent}}" hint-placeholder-val="{{ false }}"><div class="banner" style="margin:14px 0 0">If an account exists for this email, a reset link is on its way. It expires in 30 minutes.</div></template>
<p class="hint" style="margin-top:16px"><a href="P-Login.dc.html">Back to sign in</a></p>
</div></div>
<div class="r"><div class="big" style="max-width:420px">Know your defibrillators are ready.</div></div>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sent: false }; }
renderVals() {
return {
sent: this.state.sent, send: () => this.setState({ sent: true }),};
}
}
</script>
</body>
</html>
