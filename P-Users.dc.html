<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="ptop">
<div class="pb"><span class="mark" style="background:var(--p0)"><svg width="18" height="18" viewBox="0 0 24 24" fill="#d8352a" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.700 1.100 5.500 3.200 1.800-2.100 3.500-3.200 5.500-3.200 3.700 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg></span><span style="color:var(--p7)">AEDS Portal</span></div>
<nav class="pnav"><a href="P-Assets.dc.html">My assets</a><a href="P-Reports.dc.html">Reports</a><a class="on" href="P-Users.dc.html">Account</a></nav>
<span style="display:flex;gap:12px;align-items:center"><span class="cs">Sample Client A</span><a class="btn sec sm" href="P-Login.dc.html">Sign out</a></span>
</div>
<div class="pwrap">
<div class="ph"><div><div class="h1">Account</div><div class="sub">Your own details at Sample Client A.</div></div></div>
<div class="g2">
<div class="card"><div class="ch">Your details</div>
<dl class="kv2"><dt>Name</dt><dd>Sample Portal User</dd><dt>Email</dt><dd>pa@sample-a.example</dd><dt>Customer</dt><dd>Sample Client A</dd><dt>Access</dt><dd>View only</dd></dl></div>
<div class="card"><div class="ch">Change password</div>
<div class="f" style="margin-bottom:12px"><label for="o">Current password</label><input id="o" type="password" class="fi" value="samplepass"></div>
<div class="f" style="margin-bottom:12px"><label for="n">New password</label><input id="n" type="password" class="fi"></div>
<button class="btn" onClick="{{upd}}">Update password</button><template data-sc="if" value="{{done}}" hint-placeholder-val="{{ false }}"><span class="tag ok" style="margin-left:10px">Password updated</span></template></div>
</div>
<div class="banner" style="margin-top:16px">Portal accounts are created by AEDS. To add or remove someone at your organisation, contact AEDS.</div>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { done: false }; }
renderVals() {
return {
done: this.state.done, upd: () => this.setState({ done: true }),};
}
}
</script>
</body>
</html>
