<template data-sc="if" value="{{d_bmerge}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Merge sites<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><template data-sc="if" value="{{mergeFew}}" hint-placeholder-val="{{ false }}"><div class="mb"><p>Select at least 2 sites to merge.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Close</button></div></template><template data-sc="if" value="{{mergeOk}}" hint-placeholder-val="{{ true }}"><div class="mb"><div class="f"><label for="bmq">Merge into *</label><div class="cbo"><input id="bmq" class="fi" autocomplete="off" placeholder="Search sites by name" value="{{mq}}" onChange="{{mtype}}" onFocus="{{mfocus}}"><button class="cbo-c" onClick="{{mtoggle}}" aria-label="Show sites"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><template data-sc="if" value="{{mopen}}" hint-placeholder-val="{{ true }}"><div class="cbl"><template data-sc="if" value="{{hasSelOpts}}" hint-placeholder-val="{{ true }}"><div class="cbo-g">Selected</div><template data-sc="for" list="{{moptsSel}}" as="n" hint-placeholder-count="2"><button class="cbo-o {{n.on}}" onClick="{{n.pick}}"><span>{{n.name}}</span><span class="cs">{{n.sub}}</span></button></template></template><template data-sc="if" value="{{hasOtherOpts}}" hint-placeholder-val="{{ true }}"><div class="cbo-g">Other sites</div><template data-sc="for" list="{{moptsOther}}" as="n" hint-placeholder-count="3"><button class="cbo-o {{n.on}}" onClick="{{n.pick}}"><span>{{n.name}}</span><span class="cs">{{n.sub}}</span></button></template></template><template data-sc="if" value="{{mnone}}" hint-placeholder-val="{{ false }}"><div class="cbo-e">No sites match this search.</div></template></div></template><template data-sc="if" value="{{merr}}" hint-placeholder-val="{{ false }}"><span class="cberr">Choose the site to merge into.</span></template><template data-sc="if" value="{{hasKeep}}" hint-placeholder-val="{{ false }}"><span class="hint">{{mergeMsg}}</span></template></div></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_bmerge}}">Merge</button></div></template></div></div></template>
<template data-sc="if" value="{{d_bdel}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Delete sites<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p>Delete {{selCount}} selected sites?</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_bdel}}">Delete</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":940}}'>

}

const DV = st.un ? D.filter((r) => r.cust === 'Unassigned') : D;

  cells: vis.map((c) => ({ v: r[c[0]], cls: c[0] === 'comp' ? 'tag ' + r.compc : (c[0] === 'email' && r[c[0]] ? 'em' : ''), al: c[2] })) })),
