<template data-sc="if" value="{{isLogs}}" hint-placeholder-val="{{ false }}">

tton onClick="{{lrMon}}">This Month</button></div><div class="lrf"><span>{{lrHint}}</span><span><button class="btnl" onClick="{{lrClear}}">Clear</button> <button class="btn sm" onClick="{{lrDone}}">Done</button></span></div></div></template></div><button class="btnl" style="height:38px" onClick="{{lgClear}}">Clear Filters</button></div><div class="tw"><table class="tbl"><thead><tr><th style="width:70px">Time</th><th style="width:120px">Event</th><th style="width:170px">Field</th><th>Change</th><th style="width:150px">By</th></tr></thead><tbody><template data-sc="for" list="{{lgRows}}" as="r" hint-placeholder-count="6"><template data-sc="if" value="{{r.isDay}}" hint-placeholder-val="{{ false }}"><tr class="lgg"><td colspan="5">{{r.day}}</td></tr></template><template data-sc="if" value="{{r.isRow}}" hint-placeholder-val="{{ true }}"><tr><td>{{r.time}}</td><td><span class="tag {{r.cls}}">{{r.ev}}</span></td><td class="cm">{{r.field}}</td><td style="white-space:normal"><template data-sc="if" value="{{r.hasOld}}" hint-placeholder-val="{{ false }}"><span class="lgo">{{r.old}}</span><span class="lga">→</span></template>{{r.nv}}<template data-sc="if" value="{{r.hasNote}}" hint-placeholder-val="{{ false }}"><div class="cs" style="font-size:12px">{{r.note}}</div></template></td><td>{{r.by}}</td></tr></template></template><template data-sc="if" value="{{lgNone}}" hint-placeholder-val="{{ false }}"><tr><td colspan="5" class="cs">No log entries match these filters.</td></tr></template></tbody></table></div></div>
