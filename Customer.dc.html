<template data-sc="if" value="{{isIndividual}}" hint-placeholder-val="{{ false }}"><div class="fg c4"><div class="f"><label for="tt">Title</label><select id="tt" class="fi"><option>Not selected</option><option>Mr</option><option>Mrs</option><option>Ms</option><option>Dr</option></select></div><div class="f"><label for="gn"><span class="req">*</span> First name</label><input id="gn" class="fi" value="Sample"></div><div class="f"><label for="fn"><span class="req">*</span> Last name</label><input id="fn" class="fi" value="Person D"></div><div class="f"><div class="lr"><label for="pp">Primary phone</label><label class="chk"><input type="checkbox"> Do not call</label></div><input id="pp" class="fi" value="00 0000 0004"></div><div class="f"><label for="mb">Mobile phone</label><input id="mb" class="fi" value=""></div><div class="f"><label for="ap2">Alt. phone</label><input id="ap2" class="fi" value=""></div><div class="f"><label for="em2">Email</label><input id="em2" class="fi" value="person-d@sample.example"></div></div></template>
