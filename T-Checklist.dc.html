<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Visit: test readings</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="tpage">
<div class="tbar"><a href="T-Parts.dc.html">&lt; Parts</a><span>Defibrillator 01</span><span class="steps"><span>Asset</span><span>Parts</span><span class="on">Tests</span><span>Photos</span><span>Summary</span></span></div>
<div class="tbody">
<div class="th" style="margin-bottom:4px">Test Readings</div>
<p class="sub" style="font-size:15px;margin-bottom:16px">One answer per check. The five test readings set up for Defibrillator in Simpro.</p>
<div class="tc">
<template data-sc="for" list="{{rows}}" as="r" hint-placeholder-count="5">
<div class="tl"><div class="cm" style="font-size:18px">{{r.name}}</div>
<span class="seg"><button class="tbtn {{r.passCls}}" style="min-width:100px" onClick="{{r.setPass}}">Pass</button><button class="tbtn {{r.failCls}}" style="min-width:100px;border-color:var(--bd)" onClick="{{r.setFail}}">Fail</button></span></div>
</template>
</div>
<div class="tc" style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><label for="nt" style="display:block;font-weight:600;margin-bottom:6px">Note for the Customer <span class="cs">(shown in portal and PDF)</span></label><input id="nt" class="tin" placeholder="e.g. All checks passed"></div><div><label for="ni" style="display:block;font-weight:600;margin-bottom:6px">Internal Note <span class="cs">(staff only)</span></label><input id="ni" class="tin" placeholder="e.g. Cabinet door sticks"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:14px"><a class="tbtn sec" href="T-Parts.dc.html">Back</a><a class="tbtn" href="T-Photos.dc.html">Next: Photos</a></div>
</div>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { v: { 0: 'p', 1: 'p', 2: 'p', 3: 'p', 4: 'p' } }; }
renderVals() {
const names = ['AIVIA status', 'AED status', 'AED shock tested', 'Base plate secure', 'Optical sensor static green'];
const v = this.state.v;
return {
rows: names.map((n, i) => ({
name: n,
passCls: v[i] === 'p' ? '' : 'sec', failCls: v[i] === 'f' ? '' : 'sec',
setPass: () => this.setState({ v: Object.assign({}, v, { [i]: 'p' }) }),
setFail: () => this.setState({ v: Object.assign({}, v, { [i]: 'f' }) })
}))
};
}
}
</script>
</body>
</html>
