<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="app">
<nav class="side">
<div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#d8352a" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3.2 1.8-2.1 3.5-3.2 5.5-3.2 3.7 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg></span>AEDS</div>
<a class="nv" href="Main.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
<a class="nv" href="Customers.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>Customers</a>
<a class="nv" href="Sites.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sites</a>
<a class="nv" href="Contacts.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Contacts</a>
<a class="nv" href="Assets.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-9-10.5C2.600 7 5 4.500 8 4.500c1.800 0 3.200 1 4 2.500.8-1.500 2.200-2.500 4-2.500 3 0 5.400 2.500 5 6C20 16 12 21 12 21z"/></svg>Assets</a>
<a class="nv" href="Compliance.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Compliance<span class="bd">12,908</span></a>
<a class="nv" href="Reports.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
<div class="gl">Admin</div>
<a class="nv" href="Audit.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Audit log</a>
<a class="nv on" href="People.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.3 5.5 2.2 5.5 5.8"/></svg>People</a>
<a class="nv" href="Models.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Asset settings</a>
<a class="nv" href="Merge.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v6a4 4 0 004 4h8M18 14l-3-3M18 14l-3 3M6 20V14"/></svg>Site transfers</a>
<div class="who"><span class="av">AD</span><div>Sample Admin<small>Administrator</small></div></div>
</nav>
<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div><div class="crumb">Admin</div><div class="h1">People</div><div class="sub">Staff and portal users, and what each role can do.</div></div></div>
<div style="display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start">
<div class="card" style="padding:8px">
<template data-sc="for" list="{{menu1}}" as="m" hint-placeholder-count="2"><button class="smi {{m.cls}}" onClick="{{m.pick}}">{{m.label}}</button></template>
</div>
<div>
<template data-sc="if" value="{{is_users}}" hint-placeholder-val="{{ true }}"><div style="font-size:18px;font-weight:700">Users</div><div class="sub" style="margin-bottom:14px">Staff and portal accounts. Only administrators create them; users are deactivated, never deleted.</div><div class="acts" style="margin-bottom:12px;justify-content:flex-end"><button class="btn sec" onClick="{{openInvite}}">Invite portal user</button><button class="btn" onClick="{{openUser}}">Add staff user</button></div>
<div class="tb"><label class="search"><input aria-label="Filter users" placeholder="Filter by name or email"></label><span class="chip on">All</span><span class="chip">Staff</span><span class="chip">Portal users</span><span class="chip">Deactivated</span></div>
<div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Linked customer</th><th>Status</th><th></th></tr></thead><tbody>
<tr><td class="cm">Sample Admin</td><td>sample.admin@aeds.example</td><td><span class="tag in">Admin</span></td><td class="cs">None (staff)</td><td><span class="tag ok">Active</span></td><td class="r"><button class="btnl" onClick="{{openUser}}">Edit</button></td></tr>
<tr><td class="cm">Sample Office</td><td>sample.office@aeds.example</td><td><span class="tag in">Office staff</span></td><td class="cs">None (staff)</td><td><span class="tag ok">Active</span></td><td class="r"><button class="btnl" onClick="{{openUser}}">Edit</button></td></tr>
<tr><td class="cm">Sample Technician</td><td>sample.tech@aeds.example</td><td><span class="tag in">Technician</span></td><td class="cs">None (staff)</td><td><span class="tag ok">Active</span></td><td class="r"><button class="btnl" onClick="{{openUser}}">Edit</button></td></tr>
<tr><td class="cm">Sample Portal User</td><td>pa@sample-a.example</td><td><span class="tag nt">Portal user</span></td><td><a href="Customer.dc.html">Sample Client A</a></td><td><span class="tag ok">Active</span></td><td class="r"><button class="btnl" onClick="{{openUser}}">Edit</button></td></tr>
<tr><td class="cm">Sample Invitee</td><td>pv@sample-a.example</td><td><span class="tag nt">Portal user</span></td><td><a href="Customer.dc.html">Sample Client A</a></td><td><span class="tag wn">Invited</span></td><td class="r"><button class="btnl" onClick="{{openUser}}">Resend invite</button></td></tr>
<tr><td class="cm">Sample Former Staff</td><td>former@aeds.example</td><td><span class="tag in">Technician</span></td><td class="cs">None (staff)</td><td><span class="tag nt">Deactivated</span></td><td class="r"><button class="btnl" onClick="{{openUser}}">Reactivate</button></td></tr>
</tbody></table></div>
<div class="banner" style="margin-top:14px">A portal user belongs to exactly one customer. A staff user belongs to none. Deactivating a user ends their sessions at once.</div>
</template>
<template data-sc="if" value="{{is_roles}}" hint-placeholder-val="{{ false }}"><div style="font-size:18px;font-weight:700">Roles and permissions</div><div class="sub" style="margin-bottom:14px">What each role can do. Portal users only see their own customer.</div>
<div class="tw"><div style="overflow-x:auto"><table class="tbl mx"><thead><tr><th>Capability</th><th>Admin</th><th>Office staff</th><th>Technician</th><th>Portal user</th></tr></thead><tbody>
<tr><td>Clients, sites, contacts: view</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Own only</td></tr>
<tr><td>Clients, sites, contacts: create and edit</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>Archive a client</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>Reassign a site to another client</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>AED and cabinet register: view</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Own only</td></tr>
<tr><td>AED and cabinet register: create and edit</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Monitoring and SIM details</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Cabinet codes: read (logged)</td><td>Yes</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Cabinet codes: set</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Record a service visit</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Internal and technician notes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Attachments: upload / view</td><td>Yes</td><td>Yes</td><td>Yes</td><td>View shared files only</td></tr>
<tr><td>Reports and CSV export</td><td>Yes</td><td>Yes</td><td>Read only</td><td>Own certificates and reports</td></tr>
<tr><td>Manage users and portal accounts</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>Audit log</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr>
</tbody></table></div></div>

</template>
</div>
</div>
</main>

<template data-sc="if" value="{{dlgUser}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">Staff user<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb"><div class="fg c2">
<div class="f"><label for="u1">First name</label><input id="u1" class="fi" value="Sample"></div><div class="f"><label for="u2">Last name</label><input id="u2" class="fi" value="Technician"></div>
<div class="f s2"><label for="u3">Email (sign-in)</label><input id="u3" class="fi" value="sample.tech@aeds.example"></div>
<div class="f"><label for="u4">Role</label><select id="u4" class="fi"><option>Technician</option><option>Office staff</option><option>Admin</option></select></div>
<div class="f"><label for="u5">Status</label><select id="u5" class="fi"><option>Active</option><option>Deactivated</option></select></div>
</div><p class="hint">An email invite is sent to set a password. Two-factor sign-in is required for staff.</p></div>
<div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{saveDlg}}">Save user</button></div></div></div>
</template>
<template data-sc="if" value="{{dlgInvite}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">Invite portal user<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb"><div class="f"><label for="i1">Customer</label><select id="i1" class="fi"><option>Sample Client A</option><option>Sample Client B</option></select></div>
<div class="f"><label for="i2">Contact</label><select id="i2" class="fi"><option>Sample Contact 01 (c01@sample-a.example)</option><option>New person</option></select></div>
<p class="hint">The portal user sees only this customer's sites, AEDs and shared files. The invite link expires in 7 days.</p></div>
<div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{saveDlg}}">Send invite</button></div></div></div>
</template>
<template data-sc="if" value="{{dlgEdit}}" hint-placeholder-val="{{ false }}">
<div class="ovl"><div class="dlg mdl"><div class="mh">{{editTitle}}<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div>
<div class="mb">
<template data-sc="if" value="{{is_levels}}" hint-placeholder-val="{{ false }}"><div class="fg c4"><div class="f s4" style="grid-column:1/-1"><label for="e1">Service level name</label><input id="e1" class="fi" value="Battery - 4 Years"></div><div class="f"><label for="e2">Years</label><input id="e2" class="fi" value="4"></div><div class="f"><label for="e3">Months</label><input id="e3" class="fi" value="0"></div><div class="f"><label for="e4">Days</label><input id="e4" class="fi" value="0"></div><div class="f"><label for="e5">Part</label><select id="e5" class="fi"><option>Battery</option><option>Adult pad</option><option>Paediatric pad</option><option>Service</option></select></div></div><p class="hint">Changing a lifespan only affects parts fitted after the change.</p></template>
<template data-sc="if" value="{{is_tests}}" hint-placeholder-val="{{ false }}"><div class="f"><label for="e6">Check</label><input id="e6" class="fi" value="AED status"></div><div class="f"><label for="e7">Answers</label><input id="e7" class="fi" value="Pass, Fail, N/A"></div><div class="f"><label for="e8">Applies to</label><select id="e8" class="fi"><option>All service levels</option></select></div></template>
<template data-sc="if" value="{{is_types}}" hint-placeholder-val="{{ false }}"><div class="f"><label for="e9">Type name</label><input id="e9" class="fi" value="Defibrillator"></div><div class="f"><label for="e10">Default technician</label><select id="e10" class="fi"><option>Not selected</option><option>Sample Technician</option></select></div></template>
<template data-sc="if" value="{{is_lists}}" hint-placeholder-val="{{ false }}"><div class="f"><label for="e11">Values, one per line</label><textarea id="e11" class="fi" rows="6">100 Series&#10;320 Series&#10;50 Series&#10;Aivia Go</textarea></div><p class="hint">A value in use can be hidden but not deleted.</p></template>
<template data-sc="if" value="{{is_zones}}" hint-placeholder-val="{{ false }}"><div class="f"><label for="e12">Zone name</label><input id="e12" class="fi" value="NSW Regional"></div></template>
<template data-sc="if" value="{{is_notify}}" hint-placeholder-val="{{ false }}"><div class="f"><label>Name</label><input class="fi" value="Service levels (pad, battery), 14 days"></div><div class="f"><label>Days before due</label><input class="fi" value="14"></div><div class="f"><label>Send to</label><select class="fi"><option>Customer</option><option>Site primary contact</option></select></div></template>
</div>
<div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{saveDlg}}">Save</button></div></div></div>
</template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { s: 'users', dlg: '', toast: '' }; }
renderVals() {
const g1 = [['users','Users'],['roles','Roles and permissions']];
const g2 = [];
const cur = this.state.s; const set = (o) => this.setState(o);
const mk = (d) => ({ label: d[1], cls: d[0] === cur ? 'on' : '', pick: () => set({ s: d[0], dlg: '' }) });
const out = { menu1: g1.map(mk), menu2: g2.map(mk) };
['types','levels','tests','lists','zones','notify'].forEach((k) => { out['is_' + k] = false; });
g1.concat(g2).forEach((d) => { out['is_' + d[0]] = d[0] === cur; });
const names = { types: 'Asset type', levels: 'Service level', tests: 'Test reading', lists: 'Cabinet model list', zones: 'Zone', notify: 'Notification' };
return Object.assign(out, {
openUser: () => set({ dlg: 'user' }), openInvite: () => set({ dlg: 'invite' }), openEdit: () => set({ dlg: 'edit' }),
dlgUser: this.state.dlg === 'user', dlgInvite: this.state.dlg === 'invite', dlgEdit: this.state.dlg === 'edit',
editTitle: names[cur] || 'Edit', closeDlg: () => set({ dlg: '' }),
saveDlg: () => set({ dlg: '', toast: this.state.dlg === 'invite' ? 'Invite sent' : 'Saved' }),
hasToast: !!this.state.toast, toast: this.state.toast, hideToast: () => set({ toast: '' })
});
}
}
</script>
</body>
</html>
