<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div class="phl"><a class="back" href="Assets.dc.html" aria-label="Back" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="crumb"><a href="Assets.dc.html">Assets</a> / New asset</div><div class="h1">New Asset</div></div></div><div class="acts"><a class="btn sec" href="Assets.dc.html">Cancel</a><button class="btn sec" onClick="{{save}}">Save</button><button class="btn" onClick="{{save}}">Save and Finish</button></div></div>
<div class="tabs"><template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="5"><button class="tab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template></div>
<template data-sc="if" value="{{isDetails}}" hint-placeholder-val="{{ true }}"><div class="card">
<div class="grp"><div class="gt">Defibrillator</div><div class="fg"><div class="f"><label for="ty">Asset Type</label><select id="ty" class="fi"><option>Defibrillator</option><option>Cabinet</option></select></div><div class="f" style="position:relative"><label for="nsite"><span class="req">*</span> Site</label><div class="cbo"><input id="nsite" class="fi" autocomplete="off" placeholder="Search sites by name or address" value="{{siteQ}}" onChange="{{siteType}}" onFocus="{{siteFocus}}"><button class="cbo-c" onClick="{{siteToggle}}" aria-label="Show sites"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div><template data-sc="if" value="{{siteOpen}}" hint-placeholder-val="{{ false }}"><div class="cbl" style="position:absolute;left:0;right:0;top:100%;z-index:20;margin-top:4px"><template data-sc="for" list="{{siteOpts}}" as="o" hint-placeholder-count="5"><button class="cbo-o {{o.on}}" style="flex-direction:column;align-items:flex-start;gap:2px" onClick="{{o.pick}}"><span>{{o.name}}</span><span class="cs">{{o.sub}}</span></button></template><template data-sc="if" value="{{siteMore}}" hint-placeholder-val="{{ false }}"><div class="cbo-e" style="background:var(--p0);border-radius:7px">Limited to first 5 results.</div></template><template data-sc="if" value="{{siteNone}}" hint-placeholder-val="{{ false }}"><div class="cbo-e">No sites match this search.</div></template></div></template></div><div class="f"><label for="aid">Asset ID</label><input id="aid" class="fi ro" value="" readonly></div><div class="f"><label for="mo">AED Model</label><select id="mo" class="fi"><option>Mindray D1 Public</option><option>ZOLL AED Plus</option></select></div><div class="f"><label for="sn">AED Serial Number</label><input id="sn" class="fi" value=""></div><div class="f"><label for="an">AEDS Asset Number</label><input id="an" class="fi" value=""></div><div class="f"><label for="lo">Location on Site</label><input id="lo" class="fi" value=""></div><div class="f"><label for="pd">Purchase Date</label><input type="date" id="pd" class="fi" value=""></div><div class="f"><label for="ins">Start Date</label><input type="date" id="ins" class="fi" value=""></div><div class="f"><label for="ct">Contract</label><select id="ct" class="fi"><option>Not Selected</option><option>Sample contract</option></select></div><div class="f"><label for="do">Display Order</label><input id="do" class="fi" value=""></div><div class="f"><label for="st">Status</label><select id="st" class="fi"><option>In service</option><option>Removed</option></select></div><div class="f" style="grid-column:1/-1;border-top:1px solid #e3e8ef;margin-top:4px;padding-top:12px"><div style="font-weight:600;font-size:13px">Due dates and compliance</div><div class="cs" style="font-size:12px">Compliance status follows the earliest of the three dates. Expired if it has passed, due soon within 90 days.</div></div>
<div class="f"><label for="cdd">Compliance Due Date</label><input type="date" id="cdd" class="fi" value="{{dC}}" onChange="{{setC}}"></div>
<div class="f"><label for="pdd">Pad Due Date</label><input type="date" id="pdd" class="fi" value="{{dP}}" onChange="{{setP}}"></div>
<div class="f"><label for="bdd">Battery Due Date</label><input type="date" id="bdd" class="fi" value="{{dB}}" onChange="{{setB}}"></div>
<div class="f" style="grid-column:1/-1"><label>Compliance Status</label><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="tag {{cCls}}">{{cStat}}</span><span class="cs">{{cWhy}}</span></div></div>

</div></template>

<template data-sc="if" value="{{isHistory}}" hint-placeholder-val="{{ false }}">
<div class="stabs"><button class="stab {{hsCls}}" onClick="{{pickHs}}">Service History</button><button class="stab {{htCls}}" onClick="{{pickHt}}">Transfer History</button></div><template data-sc="if" value="{{isHs}}" hint-placeholder-val="{{ true }}"><div class="card"><div class="ch">Service History</div><div class="fg" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:14px"><div class="f"><label for="hf1">Date Range</label><div style="display:flex;gap:8px;align-items:center"><input type="date" id="hf1" class="fi" aria-label="From"><span class="cs">to</span><input type="date" class="fi" aria-label="To"></div></div><div class="f"><label for="hf2">Technician</label><select id="hf2" class="fi"><option>Not Selected</option><option>Sample Technician</option></select></div><div class="f"><label for="hf3">Pass / Fail</label><select id="hf3" class="fi"><option>Not Selected</option><option>Pass</option><option>Fail</option></select></div></div><div class="tw"><table class="tbl"><thead><tr><th>Date Tested</th><th>Technician</th><th>Service Level</th><th>Pass / Fail</th><th>Notes</th></tr></thead><tbody><tr><td colspan="5" class="cs">No results found.</td></tr></tbody></table></div></div></template><template data-sc="if" value="{{isHt}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Transfer History</div><div class="tw"><table class="tbl"><thead><tr><th>Date</th><th>From</th><th>To</th><th>Reason</th><th>By</th></tr></thead><tbody><tr><td colspan="5" class="cs">No transfers yet.</td></tr></tbody></table></div></div></template>
</template>
<template data-sc="if" value="{{isRelated}}" hint-placeholder-val="{{ false }}"><div class="card"><div class="ch">Related Assets <span><button class="btn sm" onClick="{{o_link}}">Link Asset</button></span></div><p class="cs">No related assets. Link the cabinet that holds this defibrillator.</p></div></template>
</main>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
