<!doctype html>

<body>
<template id="dc-tpl">

<div class="app">

<a class="nv" href="Main.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
<a class="nv on" href="Customers.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>Customers</a>
<a class="nv" href="Sites.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sites</a>
<a class="nv" href="Contacts.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Contacts</a>
<a class="nv" href="Assets.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-9-10.5C2.600 7 5 4.500 8 4.500c1.800 0 3.200 1 4 2.500.8-1.500 2.200-2.500 4-2.500 3 0 5.400 2.500 5 6C20 16 12 21 12 21z"/></svg>Assets</a>
<a class="nv" href="Compliance.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Compliance<span class="bd">12,908</span></a>

<a class="nv" href="Audit.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Audit log</a>
<a class="nv" href="People.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.3 5.5 2.2 5.5 5.8"/></svg>People</a>
<a class="nv" href="Models.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Asset settings</a>
<div class="who"><span class="av">AD</span><div>Sample Admin<small>Administrator</small></div></div>
</nav>
<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div class="phl"><a class="back" href="Customers.dc.html" aria-label="Back" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="crumb"><a href="Customers.dc.html">Customers</a> / New customer</div><div class="h1">New customer</div><div class="sub">Contacts, sites, attachments and notes open after the first save.</div></div></div></div>
<div class="tabs"><template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="4"><button class="tab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template></div>
<template data-sc="if" value="{{isTopProfile}}" hint-placeholder-val="{{ true }}"><div class="stabs"><template data-sc="for" list="{{subs}}" as="t" hint-placeholder-count="7"><button class="stab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template></div></template>
<template data-sc="if" value="{{is_details}}" hint-placeholder-val="{{ true }}">
<div class="card">
<div class="grp"><div class="gt"><span>{{kindTitle}}</span></div>
<div class="radio"><button class="opt2" onClick="{{setCompany}}"><span class="rd {{coOn}}"></span>Company</button><button class="opt2" onClick="{{setIndividual}}"><span class="rd {{inOn}}"></span>Individual</button></div>
<template data-sc="if" value="{{isCompany}}" hint-placeholder-val="{{ true }}"><div class="fg c4"><div class="f s2"><label for="n"><span class="req">*</span> Company name</label><input id="n" class="fi" value=""></div><div class="f"><label for="ab">ABN</label><input id="ab" class="fi" value=""></div><div class="f"><label for="wb">Website</label><input id="wb" class="fi" value=""></div><div class="f"><label for="em">Email</label><input id="em" class="fi" value=""></div><div class="f"><div class="lr"><label for="ph">Company phone</label><label class="chk"><input type="checkbox"> Do not call</label></div><input id="ph" class="fi" value=""></div><div class="f"><label for="fx2">Company fax</label><input id="fx2" class="fi" value=""></div><div class="f"><label for="ap">Alt. phone</label><input id="ap" class="fi" value=""></div></div></template>
<template data-sc="if" value="{{isIndividual}}" hint-placeholder-val="{{ false }}"><div class="fg c4"><div class="f"><label for="tt">Title</label><select id="tt" class="fi"><option>Not selected</option><option>Mr</option><option>Mrs</option><option>Ms</option><option>Dr</option></select></div><div class="f"><label for="gn"><span class="req">*</span> First name</label><input id="gn" class="fi" value=""></div><div class="f"><label for="fn"><span class="req">*</span> Last name</label><input id="fn" class="fi" value=""></div><div class="f"><div class="lr"><label for="pp">Primary phone</label><label class="chk"><input type="checkbox"> Do not call</label></div><input id="pp" class="fi" value=""></div><div class="f"><label for="mb">Mobile phone</label><input id="mb" class="fi" value=""></div><div class="f"><label for="ap2">Alt. phone</label><input id="ap2" class="fi" value=""></div><div class="f"><label for="em2">Email</label><input id="em2" class="fi" value=""></div></div></template>
</div>
<div class="split"><div class="grp"><div class="gt">Location</div><div class="fg"><div class="f s3"><label for="la">Street address</label><textarea id="la" class="fi" rows="2" placeholder="Search address"></textarea></div><div class="f"><label for="ls">Suburb</label><input id="ls" class="fi" value=""></div><div class="f"><label for="lt">State</label><select id="lt" class="fi"><option>Not selected</option><option>NSW</option><option>VIC</option><option>QLD</option><option>WA</option><option>SA</option><option>TAS</option><option>ACT</option><option>NT</option></select></div><div class="f"><label for="lp">Postcode</label><input id="lp" class="fi" value=""></div><div class="f"><label for="lc">Country</label><input id="lc" class="fi" value="Australia"></div></div></div><div class="grp"><div class="gt">Postal address<label class="chk"><input type="checkbox"> Same as street</label></div><div class="fg"><div class="f s3"><label for="qa">Street address</label><textarea id="qa" class="fi" rows="2" placeholder="Search address"></textarea></div><div class="f"><label for="qs">Suburb</label><input id="qs" class="fi" value=""></div><div class="f"><label for="qt">State</label><select id="qt" class="fi"><option>Not selected</option><option>NSW</option><option>VIC</option><option>QLD</option><option>WA</option><option>SA</option><option>TAS</option><option>ACT</option><option>NT</option></select></div><div class="f"><label for="qp">Postcode</label><input id="qp" class="fi" value=""></div><div class="f"><label for="qc">Country</label><input id="qc" class="fi" value="Australia"></div></div></div></div>
<div class="grp" style="margin-top:18px"><div class="gt"><button class="opt2" onClick="{{toggleSite}}"><span class="cbx {{siteOn}}">✓</span>Create a new site with this address</button></div>
<template data-sc="if" value="{{createSite}}" hint-placeholder-val="{{ true }}"><div class="fg c2"><div class="f"><label for="sn">Site name</label><input id="sn" class="fi" value="" placeholder="Optional, uses the street address if blank"></div><div class="f"><label for="zo">Zone</label><input id="zo" class="fi" value=""></div></div></template>
</div>
<div class="grp" style="margin-top:18px"><div class="gt">Record</div><div class="fg c4"><div class="f"><label for="dc">Date created</label><input id="dc" class="fi ro" value="04/11/2026" readonly></div><div class="f"><label for="id">Customer ID</label><input id="id" class="fi ro" value="Assigned on save" readonly></div></div></div>
<div class="bar"><a class="btn sec" href="Customers.dc.html">Cancel</a><a class="btn sec" href="Customer.dc.html">Save</a><a class="btn" href="Customer.dc.html">Save and finish</a></div>
</div>

</template>
<template data-sc="if" value="{{is_contacts}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Contacts<span></span></div><div class="sbx"><div class="grpin" style="width:360px"><input aria-label="Add from existing contacts" placeholder="Add from existing contacts"><button>Add</button></div><a class="btn sm" href="Contact-New.dc.html" style="margin-left:auto">Create contact</a></div><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Department</th><th>Position</th><th>Work phone</th><th>Mobile phone</th><th>Home phone</th><th>Fax</th><th>Email</th></tr></thead><tbody><tr><td colspan="8" class="cs">No contacts yet. Contacts can be added before or after saving.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_settings}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Settings<span></span></div><div class="grp"><div class="gt">Customer profile</div><div class="fg c4"><div class="f"><label>Customer portal account</label><button class="btn sec" onClick="{{o_setup}}">Send setup email</button></div><div class="f"><label for="st1">Customer profile</label><select id="st1" class="fi"><option>Not selected</option></select></div><div class="f"><label for="st2">Customer group</label><select id="st2" class="fi"><option>Not selected</option></select></div><div class="f"><label for="st3">Account manager</label><select id="st3" class="fi"><option>Not selected</option><option>Sample Admin</option></select></div><div class="f"><label for="st4">Referred by</label><input id="st4" class="fi" value="" placeholder=""></div><div class="f"><label for="st5">Service job cost centre</label><select id="st5" class="fi"><option>Not selected</option><option>Contracts</option></select></div><div class="f"><label for="st6">Preferred notification method</label><select id="st6" class="fi"><option>Not selected</option><option>Email</option><option>SMS</option><option>Post</option></select></div><div class="f"><label for="st7">Currency</label><input id="st7" class="fi" value="AUD" placeholder=""></div><div class="f" style="grid-column:1/-1"><label for="st8">Notes</label><textarea id="st8" class="fi" rows="3"></textarea></div></div></div></div>
</template>
<template data-sc="if" value="{{is_tags}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Tags<span></span></div><div class="g2"><div class="grp"><div class="gt">Available tags <button class="btnl" onClick="{{ok_tag}}">Add all</button></div><div class="li"><span>Contract customer</span><button class="btnl" onClick="{{ok_tag}}">Add</button></div><div class="li"><span>School</span><button class="btnl" onClick="{{ok_tag}}">Add</button></div><div class="li"><span>Council</span><button class="btnl" onClick="{{ok_tag}}">Add</button></div><div class="li"><span>Gym and fitness</span><button class="btnl" onClick="{{ok_tag}}">Add</button></div></div><div class="grp"><div class="gt">Assigned tags <button class="btnl" onClick="{{ok_tag}}">Remove all</button></div><p class="cs">No tags assigned.</p></div></div></div>
</template>
<template data-sc="if" value="{{is_resp}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Response times<span></span></div><div class="sbx"><select class="fi" style="width:260px" aria-label="Response time"><option>Not selected</option></select><button class="btn sm" onClick="{{ok_add}}">Add</button><label class="chk" style="margin-left:auto"><input type="checkbox"> Remove default</label></div><div class="tw"><table class="tbl"><thead><tr><th>Response time</th><th>Days</th><th>Hours</th><th>Minutes</th><th>Include weekends</th><th>Default</th></tr></thead><tbody><tr><td colspan="6" class="cs">No results found.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_tech}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Preferred technician<span></span></div><div class="sbx"><select class="fi" style="width:260px" aria-label="Technician"><option>Not selected</option><option>Sample Technician</option></select><button class="btn sm" onClick="{{ok_add}}">Add</button></div><div class="tw"><table class="tbl"><thead><tr><th>Employee name</th><th>Preference</th></tr></thead><tbody><tr><td colspan="2" class="cs">No results found.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_rem}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Reminders<span><button class="btn sm" onClick="{{ok_add}}">Create reminder</button></span></div><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Message</th><th>Triggers</th><th>Show in mobile</th></tr></thead><tbody><tr><td colspan="4" class="cs">No reminders found.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_rates}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Rates<span></span></div><div class="fg c4"><div class="f"><label for="r1">Service fee</label><select id="r1" class="fi"><option>Site Attendance Fee (SYD)</option></select></div><div class="f"><label for="r2">Part tax code</label><select id="r2" class="fi"><option>Use part tax code</option></select></div><div class="f"><label for="r3">Labour tax code</label><select id="r3" class="fi"><option>Use labour tax code</option></select></div><div class="f"><label for="r4">Discount (%)</label><input id="r4" class="fi" value="0" placeholder=""></div><div class="f"><label for="r5">Fee (%)</label><input id="r5" class="fi" value="" placeholder=""></div></div></div>
</template>
<template data-sc="if" value="{{is_files}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Attachments<span><button class="btn sec sm" onClick="{{o_folder}}">Create folder</button></span></div><button class="ph2" style="width:100%;height:64px;margin-bottom:12px;border-style:dashed;cursor:pointer" onClick="{{o_upload}}">Click or drag and drop files here to upload</button><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Added by</th><th>Date</th><th>Size</th><th>Shared with customer</th></tr></thead><tbody><tr><td colspan="5" class="cs">No attachments yet.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_logs}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Logs<span></span></div><p class="sub">Logs start after the first save.</p></div>
</template>
</main>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { toast: '', tab: 'profile', sub: 'details', dlg: '',  kind: 'co', site: true }; }
renderVals() {
const k = this.state.kind;
const TOP = [['profile', 'Profile', ''], ['files', 'Attachments', ''], ['logs', 'Logs', '']]; const SUB = [['details', 'Details', ''], ['contacts', 'Contacts', '']]; const top = this.state.tab; const sub = this.state.sub; const cur = top === 'profile' ? sub : top;
return {
tabs: TOP.map((d) => ({ label: d[1], badge: d[2], cls: d[0] === top ? 'on' : '', pick: () => this.setState({ tab: d[0] }) })), subs: SUB.map((d) => ({ label: d[1], badge: d[2], cls: d[0] === sub ? 'on' : '', pick: () => this.setState({ sub: d[0] }) })), isTopProfile: top === 'profile',
is_details: cur === 'details', is_contacts: cur === 'contacts', is_settings: cur === 'settings', is_tags: cur === 'tags', is_resp: cur === 'resp', is_tech: cur === 'tech', is_rem: cur === 'rem', is_rates: cur === 'rates', is_files: cur === 'files', is_logs: cur === 'logs',
ok_tag: () => this.setState({ toast: 'Tags updated' }), ok_add: () => this.setState({ toast: 'Added' }), o_setup: () => this.setState({ toast: 'Setup email will be sent after saving' }), o_upload: () => this.setState({ toast: 'File added. It uploads when you save.' }), o_folder: () => this.setState({ toast: 'Folder created' }),
hasToast: !!this.state.toast, toast: this.state.toast, hideToast: () => this.setState({ toast: '' }),

kindTitle: k === 'co' ? 'Company details' : 'Individual details',
coOn: k === 'co' ? 'on' : '', inOn: k === 'in' ? 'on' : '',
isCompany: k === 'co', isIndividual: k === 'in',
setCompany: () => this.setState({ kind: 'co' }), setIndividual: () => this.setState({ kind: 'in' }),
createSite: this.state.site, siteOn: this.state.site ? 'on' : '',
toggleSite: () => this.setState({ site: !this.state.site })
};
}
}
</script>
</body>
</html>
