<div class="sbx"><div class="grpin"><input aria-label="Search contacts" placeholder="Search by name, email or phone"><button>Search</button></div>
<button class="btnl" onClick="{{toggleAdv}}">{{advLabel}}</button><button class="btnl" onClick="{{openSave}}">Save Search</button><button class="btnl" onClick="{{openCols}}">Modify Table View</button></div>
<template data-sc="if" value="{{adv}}" hint-placeholder-val="{{ false }}">
<div class="panel"><div class="fg c4">

<div class="f"><label for="a3">Department</label><input id="a3" class="fi"></div>

</div>
<div class="bar"><button class="btn sec" onClick="{{toggleAdv}}">Clear</button><button class="btn" onClick="{{toggleAdv}}">Apply Filters</button></div></div>

<template data-sc="if" value="{{d_bdel}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Delete Contacts<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><p>Delete {{selCount}} selected contacts?</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_bdel}}">Delete</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
