<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff sign-in</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="auth">
<div class="l"><div class="box">
<div class="pb" style="margin-bottom:32px"><span class="mark" style="background:var(--p0)"><svg width="18" height="18" viewBox="0 0 24 24" fill="#d8352a" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.700 1.100 5.500 3.200 1.800-2.100 3.500-3.200 5.500-3.200 3.700 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg></span><span style="color:var(--p7)">AUSTRALIAN DEFIBRILLATORS</span></div>
<h1 class="h1" style="margin-bottom:6px">Staff sign-in</h1>
<p class="sub" style="margin-bottom:24px">For AEDS administrators, office staff and technicians.</p>
<div class="f" style="margin-bottom:16px"><label for="e">Email</label><input id="e" class="fi" value="sample.admin@aeds.example"></div>
<div class="f" style="margin-bottom:8px"><label for="p">Password</label><input id="p" type="password" class="fi" value="samplepass"></div>
<div style="text-align:right;margin-bottom:20px"><button class="btnl" onClick="{{o_forgot}}">Forgot password?</button></div>
<a class="btn" style="width:100%;height:44px" href="Main.dc.html">Sign in</a>
<p class="hint" style="margin-top:16px">Technicians use the tablet app: <a href="T-Signin.dc.html">open tablet sign-in</a></p>
</div></div>
<div class="r"><div class="big" style="max-width:420px">Every defibrillator, every site, always ready.</div><p style="margin-top:16px;color:#b8d0f0;max-width:420px">One register for customers, sites, assets and the dates that keep them compliant.</p></div>
<template data-sc="if" value="{{d_forgot}}" hint-placeholder-val="{{ false }}"><div class="ovl"><div class="dlg mdl"><div class="mh">Reset your password<button class="xb" onClick="{{closeDlg}}" aria-label="Close">×</button></div><div class="mb"><div class="f"><label for="fp1">Work email</label><input id="fp1" class="fi" value="sample.admin@aeds.example" placeholder=""></div><p class="hint">We email a reset link if an account exists. The link expires in 30 minutes.</p></div><div class="mf"><button class="btn sec" onClick="{{closeDlg}}">Cancel</button><button class="btn" onClick="{{ok_forgot}}">Send reset link</button></div></div></div></template>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { dlg: '', toast: '' }; }
renderVals() {
return {
closeDlg: () => this.setState({ dlg: '' }), hasToast: !!this.state.toast, toast: this.state.toast, hideToast: () => this.setState({ toast: '' }),
o_forgot: () => this.setState({ dlg: 'forgot' }), d_forgot: this.state.dlg === 'forgot', ok_forgot: () => this.setState({ dlg: '', toast: 'Reset link sent if the account exists' }),
};
}
}
</script>
</body>
</html>
