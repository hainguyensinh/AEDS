<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New site</title>
<script src="react-vendor.js"></script>
<script src="dc-lite.js"></script>
<link rel="stylesheet" href="ds.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>body{margin:0;font-family:Inter,system-ui,sans-serif}</style>

</head>
<body>
<template id="dc-tpl">

<div class="app">
<nav class="side">
<div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#d8352a" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.8 4.5 6.5 4.5c2 0 3.7 1.1 5.5 3.2 1.8-2.1 3.5-3.2 5.5-3.2 3.7 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg></span>AEDS</div>
<a class="nv" href="Main.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</a>
<a class="nv" href="Customers.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13M9 21v-6h6v6"/></svg>Customers</a>
<a class="nv on" href="Sites.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Sites</a>
<a class="nv" href="Contacts.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Contacts</a>
<a class="nv" href="Assets.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-9-10.5C2.600 7 5 4.500 8 4.500c1.800 0 3.200 1 4 2.500.8-1.500 2.200-2.500 4-2.500 3 0 5.400 2.500 5 6C20 16 12 21 12 21z"/></svg>Assets</a>
<a class="nv" href="Compliance.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Compliance<span class="bd">12,908</span></a>
<a class="nv" href="Reports.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</a>
<div class="gl">Admin</div>
<a class="nv" href="Audit.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Audit Log</a>
<a class="nv" href="People.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.3 5.5 2.2 5.5 5.8"/></svg>People</a>
<a class="nv" href="Models.dc.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Asset Settings</a>
<div class="who"><span class="av">AD</span><div>Sample Admin<small>Administrator</small></div></div>
</nav>
<main class="main">
<div class="top"><label class="search"><input aria-label="Search" placeholder="Search customers, sites, serial numbers"><span class="kbd">/</span></label><span class="role">Role: Administrator</span></div>
<div class="ph"><div class="phl"><a class="back" href="Sites.dc.html" aria-label="Back" title="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><div><div class="crumb"><a href="Sites.dc.html">Sites</a> / New site</div><div class="h1">New Site</div></div></div><div class="acts"><a class="btn sec" href="Sites.dc.html">Cancel</a><button class="btn sec" onClick="{{save}}">Save</button><button class="btn" onClick="{{save}}">Save and Finish</button></div></div>
<div class="tabs"><template data-sc="for" list="{{tabs}}" as="t" hint-placeholder-count="5"><button class="tab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template></div>
<template data-sc="if" value="{{isTopProfile}}" hint-placeholder-val="{{ true }}"><div class="stabs"><template data-sc="for" list="{{subs}}" as="t" hint-placeholder-count="4"><button class="stab {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></template></div></template>
<template data-sc="if" value="{{is_details}}" hint-placeholder-val="{{ true }}">
<div class="gm"><div class="card">
<div class="grp"><div class="gt">Site</div><div class="fg" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="f" style="grid-column:1/3"><label for="sn"><span class="req">*</span> Site Name</label><input id="sn" class="fi" value=""></div><div class="f" style="grid-column:3/5"><label for="cu"><span class="req">*</span> Customer</label><input id="cu" class="fi" placeholder="Search customers"><div class="hint">A site belongs to exactly one customer (D9).</div></div><div class="f"><label for="sid">Site ID</label><input id="sid" class="fi ro" value="" readonly></div></div></div>
<div class="grp"><div class="gt">Street Address</div><div class="fg" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="f" style="grid-column:1/3"><label for="la"><span class="req">*</span> Street Address</label><textarea id="la" class="fi" rows="3" placeholder="Search address"></textarea></div><div style="grid-column:3/5;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;align-content:start"><div class="f" style="grid-column:1/3"><label for="ls">Suburb</label><input id="ls" class="fi" value=""></div><div class="f"><label for="lt">State</label><select id="lt" class="fi"><option selected>Not Selected</option><option>NSW</option><option>VIC</option><option>QLD</option><option>WA</option><option>SA</option><option>TAS</option><option>ACT</option><option>NT</option></select></div><div class="f"><label for="lp">Postcode</label><input id="lp" class="fi" value=""></div></div></div></div>
<div class="grp"><div class="gt">Access Notes</div><textarea class="fi" rows="3" aria-label="Access notes" placeholder="For example: key at reception, cabinet in the main foyer"></textarea></div>

</div>
<div><div class="card"><div class="ch">Primary Contact</div><p class="sub" style="margin-bottom:12px">No primary contact has been set up.</p><a class="btn sec sm" href="Contact-New.dc.html">Set Up Primary Contact</a></div></div></div>
</template>
<template data-sc="if" value="{{is_contacts}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Contacts<span></span></div><div class="sbx"><div class="grpin" style="width:360px"><input aria-label="Add from existing contacts" placeholder="Add from existing contacts"><button>Add</button></div><a class="btn sm" href="Contact-New.dc.html" style="margin-left:auto">Create Contact</a></div><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Department</th><th>Position</th><th>Work Phone</th><th>Mobile Phone</th><th>Home Phone</th><th>Fax</th><th>Email</th></tr></thead><tbody><tr><td colspan="8" class="cs">No contacts yet. Contacts can be added before or after saving.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_tech}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Preferred Technician<span></span></div><div class="sbx"><select class="fi" style="width:260px" aria-label="Technician"><option>Not Selected</option><option>Sample Technician</option></select><button class="btn sm" onClick="{{ok_add}}">Add</button></div><div class="tw"><table class="tbl"><thead><tr><th>Employee Name</th><th>Preference</th></tr></thead><tbody><tr><td colspan="2" class="cs">No results found.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_rem}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Reminders<span><button class="btn sm" onClick="{{ok_add}}">Create Reminder</button></span></div><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Message</th><th>Triggers</th><th>Show in Mobile</th></tr></thead><tbody><tr><td colspan="4" class="cs">No reminders found.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_rates}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Rates<span></span></div><div class="fg c4"><div class="f"><label for="r1">Service Fee</label><select id="r1" class="fi"><option>Site Attendance Fee (SYD)</option></select></div><div class="f"><label for="r2">Part Tax Code</label><select id="r2" class="fi"><option>Use part tax code</option></select></div><div class="f"><label for="r3">Labour Tax Code</label><select id="r3" class="fi"><option>Use labour tax code</option></select></div><div class="f"><label for="r4">Discount (%)</label><input id="r4" class="fi" value="0" placeholder=""></div><div class="f"><label for="r5">Fee (%)</label><input id="r5" class="fi" value="" placeholder=""></div></div></div>
</template>
<template data-sc="if" value="{{is_files}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Attachments<span><button class="btn sec sm" onClick="{{o_folder}}">Create Folder</button></span></div><button class="ph2" style="width:100%;height:64px;margin-bottom:12px;border-style:dashed;cursor:pointer" onClick="{{o_upload}}">Click or drag and drop files here to upload</button><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Added By</th><th>Date</th><th>Size</th><th>Shared with Customer</th></tr></thead><tbody><tr><td colspan="5" class="cs">No attachments yet.</td></tr></tbody></table></div></div>
</template>
<template data-sc="if" value="{{is_notes}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Notes<span></span></div><p class="sub">Notes can be added after the first save.</p></div>
</template>
<template data-sc="if" value="{{is_logs}}" hint-placeholder-val="{{ false }}">
<div class="card"><div class="ch">Logs<span></span></div><p class="sub">Logs start after the first save.</p></div>
</template>

</main>
<template data-sc="if" value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast}}<button onClick="{{hideToast}}">Dismiss</button></div></template>
</div>
</template>
<div id="dc-root"></div>
<a class="dc-back" href="index.html" title="All screens">All screens</a>
<style>.dc-back{position:fixed;right:14px;bottom:14px;z-index:999;background:#0f1b2d;color:#fff;font:600 12px/1 Inter,system-ui,sans-serif;padding:9px 12px;border-radius:8px;text-decoration:none;opacity:.85}.dc-back:hover{opacity:1}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'profile', sub: 'details', dlg: '',  toast: '' }; }
renderVals() {
const TOP = [['profile', 'Profile', ''], ['files', 'Attachments', ''], ['notes', 'Notes', ''], ['logs', 'Logs', '']]; const SUB = [['details', 'Details', ''], ['contacts', 'Contacts', '']]; const top = this.state.tab; const sub = this.state.sub; const cur = top === 'profile' ? sub : top;
return {
tabs: TOP.map((d) => ({ label: d[1], badge: d[2], cls: d[0] === top ? 'on' : '', pick: () => this.setState({ tab: d[0] }) })), subs: SUB.map((d) => ({ label: d[1], badge: d[2], cls: d[0] === sub ? 'on' : '', pick: () => this.setState({ sub: d[0] }) })), isTopProfile: top === 'profile',
is_details: cur === 'details', is_contacts: cur === 'contacts', is_tech: cur === 'tech', is_rem: cur === 'rem', is_rates: cur === 'rates', is_files: cur === 'files', is_notes: cur === 'notes', is_logs: cur === 'logs',
ok_tag: () => this.setState({ toast: 'Tags updated' }), ok_add: () => this.setState({ toast: 'Added' }), o_setup: () => this.setState({ toast: 'Setup email will be sent after saving' }), o_upload: () => this.setState({ toast: 'File added. It uploads when you save.' }), o_folder: () => this.setState({ toast: 'Folder created' }),

save: () => this.setState({ toast: 'Saved. Opening the record.' }), hasToast: !!this.state.toast, toast: this.state.toast, hideToast: () => this.setState({ toast: '' })
};
}
}
</script>
</body>
</html>
